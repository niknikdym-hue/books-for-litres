name: Dilon Native Mount Once

on:
  push:
    branches:
      - brain/dilon-native-mounted-ui-v1

permissions:
  contents: write

jobs:
  mount:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: brain/dilon-native-mounted-ui-v1
          fetch-depth: 1

      - name: Mount accepted Dilon native flow into StudioView
        run: python audiobook-studio/tools/mount_dilon_native_ui.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F '@StateObject private var dilonFlow = DilonNativeFlowController()' audiobook-studio/native/AudiobookStudioApp.swift
          grep -F 'DilonNativeCard(' audiobook-studio/native/AudiobookStudioApp.swift
          grep -F '.task(id: dilonSelectionKey)' audiobook-studio/native/AudiobookStudioApp.swift

      - name: Commit mounted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audiobook-studio/native/AudiobookStudioApp.swift
          git commit -m 'Mount Dilon native flow in StudioView [skip ci]'
          git push origin HEAD:brain/dilon-native-mounted-ui-v1
