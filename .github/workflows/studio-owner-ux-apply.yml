name: Apply Studio owner UX patch

on:
  push:
    branches:
      - brain/content-quality-lexicon-v1

permissions:
  contents: write

concurrency:
  group: studio-owner-ux-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source patch
        run: python tools/apply_studio_owner_ux_patch.py
      - name: Verify patch contracts
        working-directory: audiobook-studio
        run: |
          python -m unittest tests.test_book_sound_design -v
          python -m unittest tests.test_owner_production_flow_source -v
          git diff --check
      - name: Commit patched production sources
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "Audiobook Studio Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add audiobook-studio/native/AudiobookStudioApp.swift audiobook-studio/dilon_identity.py audiobook-studio/chapter_assembly.py
          git commit -m "Make Studio author-first and wire chapter cues"
          git push origin HEAD:brain/content-quality-lexicon-v1
