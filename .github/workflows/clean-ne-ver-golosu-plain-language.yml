name: Clean Ne ver golosu plain language

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-ne-ver-golosu-plain-language.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace unnecessary technical terms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')
          changes={
          '00-PROLOG.md': [
            ('криптографически проверяемое происхождение материала', 'проверяемая история происхождения материала')],
          '01-VOICE.md': [
            ('Мир был бы невыносим, если бы каждое бытовое взаимодействие начиналось с аутентификации.',
             'Мир был бы невыносим, если бы каждое бытовое взаимодействие начиналось с проверки личности.'),
            ('### Где заканчивается биометрия бытового уровня', '### Почему узнавание голоса — не доказательство личности'),
            ('Мы часто употребляем слово «биометрия» так, будто любая физиологическая особенность автоматически является надёжным ключом. На практике всё сложнее.\n\nГолос действительно может использоваться в специальных системах распознавания. Но бытовое узнавание человеком и формальная система голосовой биометрии — не одно и то же. Более того, само наличие биометрического сравнения не делает всю систему неуязвимой. Современные рекомендации по цифровой идентичности исходят из многослойной защиты: важны канал, источник сигнала, защита от подмены, дополнительные факторы и процедура.',
             'Голос действительно можно использовать в специальных системах распознавания. Но то, что человек узнаёт голос на слух, и автоматическая проверка — не одно и то же. Даже точное сравнение голоса не делает всю систему неуязвимой. Надёжная защита учитывает источник сигнала, способ связи, дополнительные подтверждения и процедуру.'),
            ('Это полезная интеллектуальная прививка от магического мышления.', 'Это помогает избежать простой ошибки.'),
            ('мошенническую имперсонацию', 'выдачу себя за другого человека')],
          '02-FACE.md': [
            ('превращать сегодняшний дефект технологии в завтрашний механизм аутентификации',
             'превращать сегодняшний дефект технологии в завтрашний способ проверки личности'),
            ('В финальных рекомендациях NIST по цифровой идентичности, опубликованных в 2025 году, отдельный раздел посвящён атакам с внедрением цифрового медиапотока и поддельным медиа. Там формулировка довольно отрезвляющая: **все формы удалённого подтверждения личности в той или иной степени уязвимы для подобных атак**. Одного сравнения биометрического образца недостаточно. Нужны дополнительные технические меры, защищённый канал, проверка медиа на признаки манипуляции, оценка ошибок автоматических алгоритмов и, в определённых сценариях, человеческий контроль.',
             'В финальных рекомендациях NIST по подтверждению личности, опубликованных в 2025 году, отдельно рассматривается подмена сигнала камеры или микрофона заранее подготовленным либо искусственно созданным изображением или звуком. Вывод практический: **удалённая проверка личности не должна опираться только на изображение или голос**. Нужны дополнительные независимые проверки, а при высокой цене ошибки — участие человека.'),
            ('финальной аутентификацией полномочий', 'окончательным подтверждением полномочий')],
          '03-MESSAGES.md': [
            ('Учётная запись способна быть скомпрометирована. Телефон может оказаться в чужих руках. Сессия — украдена. Почта — взломана. В корпоративном мире компрометация реального почтового ящика особенно неприятна именно потому, что убирает самый очевидный внешний дефект: адрес не похож на настоящий — он и есть настоящий.',
             'Посторонний может получить доступ к настоящей учётной записи, телефону или почте. В деловой переписке это особенно опасно: адрес не выглядит поддельным — он действительно принадлежит нужному человеку или компании.'),
            ('знание биографической детали криптографической подписью', 'знание биографической детали доказательством личности'),
            ('должны считаться сильным современным механизмом подтверждения личности', 'должны считаться надёжным способом подтверждения личности')],
          '05-DECISION.md': [
            ('генеративный ИИ облегчает имперсонацию доверенных лиц', 'генеративный ИИ облегчает выдачу себя за доверенных людей'),
            ('реалистичность имперсонации', 'реалистичность подделки личности')],
          '06-SECRECY.md': [
            ('Иногда безопасность описывают исключительно техническим языком: многофакторная аутентификация, антифрод, криптография, мониторинг.',
             'Безопасность часто описывают языком технологий и специальных систем.'),
            ('одному скомпрометированному каналу', 'одному ненадёжному каналу')],
          '07-KNOWLEDGE.md': [
            ('секреты аутентификации', 'секретные сведения для подтверждения личности'),
            ('строить сильную аутентификацию', 'строить надёжную проверку личности'),
            ('даже идеальная аутентификация личности', 'даже идеально подтверждённая личность')],
          '07A-TRUST-CHAIN.md': [
            ('посмотреть на имперсонацию', 'посмотреть на подмену личности'),
            ('При компрометации аккаунта нужно считать риск более широким, чем один конкретный диалог.',
             'Если посторонний получил доступ к аккаунту, риск не ограничивается одним конкретным диалогом.'),
            ('имперсонации сложнее незаметно присвоить его по пути', 'самозванцу сложнее незаметно присвоить его по пути')],
          '08-EXIT-CHANNEL.md': [
            ('**Кто просит?** — вопрос аутентификации.', '**Кто просит?** — вопрос подтверждения личности.')],
          '09-RISK.md': [
            ('Фотография кота — криптографической подписи.', 'Фотография кота — доказательства подлинности.'),
            ('В профессиональной цифровой идентичности используется понятие уровня уверенности — степени уверенности, необходимой для конкретной операции. Разные риски требуют разных мер. Мы не будем переносить технические уровни стандартов NIST в семейный мессенджер: это было бы декоративной экспертностью.',
             'Чем выше цена ошибки, тем сильнее должна быть проверка. Для семейного мессенджера не нужны технические уровни стандартов: достаточно связать глубину проверки с возможными последствиями.')],
          '10-FAMILY.md': [
            ('Предупреждаем остальных членов семьи, потому что имперсонация может продолжиться по социальной цепочке.',
             'Предупреждаем остальных членов семьи, потому что самозванец может попытаться связаться и с ними.')],
          '11-BUSINESS.md': [
            ('сотрудник получил фишинговое письмо от имени финансового директора', 'сотрудник получил мошенническое письмо от имени финансового директора'),
            ('### Компрометация деловой переписки старше генеративного ИИ', '### Подмена деловой переписки существовала и до генеративного ИИ'),
            ('Компрометация деловой электронной почты — мошенничество с компрометацией или имитацией деловой переписки — не появилась вместе с нейросетями. Такие инциденты давно показывают, что знакомое имя отправителя или привычная рабочая переписка сами по себе не должны разрешать перевод денег или изменение реквизитов.',
             'Мошенничество через подменённую или захваченную деловую переписку существовало задолго до нейросетей. Такие случаи давно показывают: знакомое имя отправителя и привычный адрес сами по себе не должны разрешать перевод денег или изменение реквизитов.'),
            ('рекомендации ФБР по защите от компрометации деловой электронной почты', 'рекомендации ФБР по защите деловой переписки'),
            ('Использовать многофакторную защиту аккаунтов.', 'Использовать дополнительную защиту входа в аккаунты.'),
            ('Это защита его собственной цифровой идентичности.', 'Это защита его имени и полномочий от подмены.'),
            ('Имперсонация в компании — не только деньги.', 'Выдача себя за сотрудника компании угрожает не только деньгам.'),
            ('код многофакторной аутентификации', 'код подтверждения входа'),
            ('Аутентификация отвечает на вопрос «кто». Контроль доступа — «что ему разрешено».',
             'Подтверждение личности отвечает на вопрос «кто». Контроль доступа — «что ему разрешено».'),
            ('Для финансовых и киберинцидентов минуты иногда имеют значение.', 'При финансовых инцидентах и взломах минуты иногда имеют значение.'),
            ('предупреждение о дальнейшей имперсонации', 'предупреждение о возможных новых сообщениях от самозванца')],
          '13-DIGITAL-DOUBLE.md': [
            ('связь между изображением и идентичностью человека', 'связь между изображением и конкретным человеком'),
            ('**посмертное продолжение идентичности**', '**посмертное использование образа человека**'),
            ('**утверждение об авторстве поведения**', '**вопрос о том, действительно ли человек это сказал или сделал**'),
            ('голос или видео как единственную авторизацию денег и доступов', 'голос или видео как единственное подтверждение денежных операций и выдачи доступа'),
            ('внутренний порядок действий при имперсонации', 'внутренний порядок действий, если кто-то выдаёт себя за сотрудника')],
          '15-CONCLUSION.md': [
            ('криптографического подтверждения полномочий на банковский перевод', 'формального подтверждения полномочий на банковский перевод')]
          }
          changed=[]
          for name,pairs in changes.items():
              p=root/name
              t=p.read_text(encoding='utf-8')
              before=t
              for old,new in pairs:
                  if old not in t:
                      raise SystemExit(f'Missing exact phrase in {name}: {old[:150]}')
                  t=t.replace(old,new)
              if t!=before:
                  p.write_text(t,encoding='utf-8')
                  changed.append(name)
          print('CHANGED', len(changed), changed)
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Simplify technical language in Ne ver golosu'
          git push
