name: Final Ne ver golosu reader gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-reader-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plain language safety and Latin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          root=Path('ne-ver-golosu/manuscript')
          reader=sorted(p for p in root.glob('*.md') if p.name!='17-SOURCES.md')
          text='\n'.join(p.read_text(encoding='utf-8') for p in reader)
          forbidden=[
            'атака с внедрением цифрового медиапотока','цифрового медиапотока','медиапотока',
            'аутентификац','аутентификатор','авторизац','имперсонац','компрометац',
            'риск-процедур','риск-модел','антифрод','киберинцидент','фишинг-устойчив',
            'проверка живого присутствия','проверки живого присутствия','уровень уверенности',
            'цифровая идентичность','цифровой идентичности','идентичности человека',
            'манифест','валидатор','цифровой актив','цифрового актива','ложная атрибуция',
            'генерализация детектор','детекция','фактологический срез','техножаргон',
            'реальный кейс','реальные кейсы','архитектурный вопрос','интеллектуальная опора'
          ]
          hits=[]
          for p in reader:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              low=line.lower()
              for term in forbidden:
                if term in low:
                  hits.append(f'{p.name}:{n}:{term} :: {line}')
          banned_en=['authenticity','detection','identity proofing','liveness','provenance','human-in-the-loop','forensic','false positive','false negative',"liar's dividend",'generative ai','deepfake detection']
          bad_en=[x for x in banned_en if x in text.lower()]
          tokens=collections.Counter()
          rx=re.compile(r"[A-Za-z][A-Za-z0-9’'._+-]*")
          for p in reader:
            for line in p.read_text(encoding='utf-8').splitlines():
              line=re.sub(r'https?://\S+','',line)
              tokens.update(rx.findall(line))
          allowed={'NIST','SP','A-4','B-4','C2PA','C2PA.','Content','Credentials','Credentials.','PDF','PDF-','WhatsApp','WhatsApp-','IC3','I.','II.','III.','IV.'}
          unexpected=sorted(t for t in tokens if t not in allowed)
          operational=[]
          pats=[
            r'(?i)(?:мошенник|злоумышленник|атакующий)[^.!?]{0,150}(?:нужно|достаточно|должен|следует|выгодно|получить|обойти|скрыть|маскировать)',
            r'(?i)(?:как|способ)[^.!?]{0,100}(?:взломать|захватить|скомпрометировать|клонировать|подделать|обойти защит)'
          ]
          for p in reader:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(re.search(pat,line) for pat in pats): operational.append(f'{p.name}:{n}:{line}')
          required=['## Приложение 7. Краткий словарь','**Проверяемая история происхождения**','**Content Credentials (C2PA)**','Подлинность не равна истинности.']
          missing=[x for x in required if x not in text]
          print('FORBIDDEN_TECH_LINES')
          for x in hits: print(x)
          print('BANNED_ENGLISH',bad_en)
          print('UNEXPECTED_LATIN',unexpected)
          print('OPERATIONAL_ATTACK_FRAMING',operational)
          print('MISSING_REQUIRED',missing)
          failures=[]
          if hits: failures.append('unnecessary technical language')
          if bad_en: failures.append('English jargon')
          if unexpected: failures.append('unexpected Latin')
          if operational: failures.append('attacker-side operational framing')
          if missing: failures.append('required reader wording missing')
          print('FINAL_FAILURES',failures)
          if failures: raise SystemExit(1)
          PY
