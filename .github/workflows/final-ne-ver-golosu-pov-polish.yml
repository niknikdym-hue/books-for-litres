name: Final Ne ver golosu POV polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-pov-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reframe residual attacker-side explanations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')
          changes={
            '01-VOICE.md':[
              ('Именно поэтому подделка голоса действует так сильно. Она не обязана обмануть акустическую лабораторию. Ей достаточно попасть в человеческое узнавание.',
               'Для защиты важно различать лабораторную точность и человеческое узнавание. Запись не обязана быть безупречной с точки зрения специалиста, чтобы знакомое звучание вызвало у слушателя уверенность: «Это он». Поэтому само узнавание голоса нельзя использовать как окончательное подтверждение личности при высоком риске.'),
            ],
            '02-FACE.md':[
              ('Если системе генерации плохо удаётся моргание, разработчики получают ровно ту же публикацию, что и вы. Если лицо распадается при повороте головы, это не вечный закон природы. Это инженерная задача.',
               'Слабость конкретной версии генеративной системы не является постоянным свойством технологии. Признак, который помогает сегодня, завтра может исчезнуть. Поэтому визуальный дефект полезен как повод остановиться, но непригоден как постоянное доказательство подлинности.'),
              ('Его можно вырезать из контекста. Склеить. Изменить скорость. Подставить другую подпись. Взять старую запись и представить как сегодняшнюю. Оставить только одну фразу из длинного ответа.\n\nТак называемые простые подделки — манипуляции с настоящим контентом без сложного синтеза — напоминают неприятную вещь: «поддельность» бывает не только на уровне пикселей. Иногда каждый пиксель настоящий, а утверждение о событии — нет.',
               'Настоящее видео можно изменить, неполно показать или поместить в ложный контекст. Так называемые простые подделки — манипуляции с реальным материалом без сложного синтеза — напоминают неприятную вещь: проблема бывает не только на уровне пикселей. Иногда сам материал настоящий, а утверждение о событии — нет.'),
            ],
            '03-MESSAGES.md':[
              ('Чтобы сообщение казалось «вашим», не требуется воспроизвести личность целиком. В бытовой переписке стиль состоит из повторяющихся деталей: длина фраз, обращения, набор эмодзи, типичные сокращения, уровень формальности, любимые слова. Человеческий мозг охотно достраивает остальное.\n\nЭто похоже на карикатуру: художнику не нужно рисовать каждую пору кожи. Достаточно правильно преувеличить несколько признаков — и мы узнаём человека.\n\nСинтетический текст способен делать то же самое без карикатурного преувеличения.',
               'Для защиты достаточно знать, что привычная манера письма состоит из повторяющихся языковых признаков, которые сегодня можно воспроизводить автоматически. Человеческий мозг охотно достраивает по знакомому стилю ощущение знакомого автора. Поэтому совпадение манеры письма следует считать признаком узнавания, а не самостоятельным доказательством авторства.'),
            ],
          }
          for name,pairs in changes.items():
            p=root/name
            t=p.read_text(encoding='utf-8')
            for old,new in pairs:
              if old not in t: raise SystemExit(f'Missing exact text in {name}: {old[:100]}')
              t=t.replace(old,new)
            p.write_text(t,encoding='utf-8')
            print('changed',name)
          alltext='\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.md'))
          stale=['Ей достаточно попасть в человеческое узнавание','разработчики получают ровно ту же публикацию','Его можно вырезать из контекста. Склеить. Изменить скорость.','Чтобы сообщение казалось «вашим», не требуется воспроизвести личность целиком']
          bad=[s for s in stale if s in alltext]
          if bad: raise SystemExit(f'Stale attacker-side phrasing remains: {bad}')
          PY
          git diff --check
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Polish final defensive point of view for Ne ver golosu'
          git push
