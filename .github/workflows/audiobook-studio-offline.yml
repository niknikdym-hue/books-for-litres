name: Audiobook Studio Offline

on:
  pull_request:
    paths:
      - "audiobook-studio/**"
      - ".github/workflows/audiobook-studio-offline.yml"
  push:
    branches:
      - main
    paths:
      - "audiobook-studio/**"
      - ".github/workflows/audiobook-studio-offline.yml"

permissions:
  contents: read

concurrency:
  group: audiobook-studio-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python offline safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: audiobook-studio
    env:
      OPENAI_API_KEY: ""
      YANDEX_API_KEY: ""
      YANDEX_CLOUD_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependency
        run: python -m pip install 'numpy>=2,<3'

      - name: Targeted chapter production safety tests
        run: |
          python -m unittest discover -s tests -p 'test_chapter_production.py' -v
          python -m unittest discover -s tests -p 'test_native_ui_bridge.py' -v
          python -m unittest discover -s tests -p 'test_yandex_speechkit.py' -v
          python -m unittest discover -s tests -p 'test_yandex_pricing.py' -v

      - name: Full Audiobook Studio offline regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  native-contract:
    name: macOS ARM64 native contract
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: audiobook-studio
    env:
      OPENAI_API_KEY: ""
      YANDEX_API_KEY: ""
      YANDEX_CLOUD_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot dependency
        run: python -m pip install 'numpy>=2,<3'

      - name: Verify ARM64 host
        run: test "$(uname -m)" = "arm64"

      - name: Swift native contract
        run: python -m unittest discover -s tests -p 'test_native_contracts.py' -v

      - name: Build and strictly codesign native app
        run: native/build_native_app.sh "$RUNNER_TEMP/Audiobook Studio.app"

      - name: Install real Studio directly on isolated Desktop
        run: |
          mkdir -p "$RUNNER_TEMP/home/Desktop"
          HOME="$RUNNER_TEMP/home" /bin/zsh native/install_desktop_launcher.sh "$RUNNER_TEMP/Audiobook Studio.app"
          DESKTOP_APP="$RUNNER_TEMP/home/Desktop/Audiobook Studio.app"
          test -d "$DESKTOP_APP"
          test ! -L "$DESKTOP_APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$DESKTOP_APP/Contents/Info.plist")" = "ru.elena.audiobookstudio"
          codesign --verify --deep --strict "$DESKTOP_APP"
          file "$DESKTOP_APP/Contents/MacOS/Audiobook Studio" | grep -q 'Mach-O'

      - name: Package owner-visible Studio preview
        working-directory: ${{ runner.temp }}
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Audiobook Studio.app" "Audiobook-Studio-preview.zip"
          test -s "Audiobook-Studio-preview.zip"

      - name: Upload owner-visible Studio preview
        uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Studio-PR45-preview
          path: ${{ runner.temp }}/Audiobook-Studio-preview.zip
          if-no-files-found: error
          retention-days: 7
