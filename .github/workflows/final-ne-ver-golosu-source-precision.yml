name: Final Ne ver golosu source precision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-source-precision.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply precision fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')

          def replace_exact(name, old, new):
              p=root/name
              t=p.read_text(encoding='utf-8')
              if old not in t:
                  raise SystemExit(f'Missing exact text in {name}: {old[:100]}')
              t=t.replace(old,new)
              p.write_text(t,encoding='utf-8')
              print('changed',name)

          replace_exact(
            '13-DIGITAL-DOUBLE.md',
            'Основная часть закона начинает действовать с 1 сентября 2026 года. Статья 9, устанавливающая требования к маркировке информационных материалов, созданных с применением больших фундаментальных моделей искусственного интеллекта, вступает в силу 1 марта 2027 года; в ту же дату вступают в силу и другие положения, перечисленные в части 2 статьи 13 закона. Поэтому в этой книге эти требования не описываются как действующие нормы.',
            'Основная часть закона начинает действовать с 1 сентября 2026 года. Статья 9, посвящённая информационному предупреждению о применении технологий искусственного интеллекта при создании аудио- и визуальных материалов, вступает в силу 1 марта 2027 года; в ту же дату вступают в силу и другие положения, перечисленные в части 2 статьи 13 закона. При этом статья 9 не устанавливает универсальную обязанность маркировать каждый материал: она регулирует возможность размещения такого предупреждения и, для предусмотренных законом крупных площадок, обязанность обеспечить пользователям возможность его размещения. Поэтому в этой книге эти положения не описываются как действующие нормы.'
          )

          replace_exact(
            '17-SOURCES.md',
            '**Федеральный закон от 26.07.2026 № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации».** На дату фактологического среза 14 августа 2026 года закон подписан и опубликован, но ещё не вступил в силу. По статье 13 основная часть закона вступает в силу 1 сентября 2026 года. Статья 9 о маркировке информационных материалов, созданных с применением больших фундаментальных моделей искусственного интеллекта, а также другие положения, перечисленные в части 2 статьи 13, вступают в силу 1 марта 2027 года.',
            '**Федеральный закон от 26.07.2026 № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации».** На дату фактологического среза 14 августа 2026 года закон подписан и опубликован, но ещё не вступил в силу. По статье 13 основная часть закона вступает в силу 1 сентября 2026 года. Статья 9, регулирующая информационное предупреждение о применении технологий искусственного интеллекта при создании аудио- и визуальных материалов, а также другие положения, перечисленные в части 2 статьи 13, вступают в силу 1 марта 2027 года. Статья 9 не устанавливает универсальную обязанность маркировать каждый материал: она предусматривает возможность размещения предупреждения и обязанность определённых законом крупных площадок обеспечить пользователям такую возможность.'
          )

          replace_exact(
            '17-SOURCES.md',
            '**Robert Chesney, Danielle Keats Citron.** *Deep Fakes: A Looming Challenge for Privacy, Democracy, and National Security*, California Law Review, т. 107, 2019. Источник концепции «дивиденда лжеца».',
            '**Bobby Chesney, Danielle Citron.** *Deep Fakes: A Looming Challenge for Privacy, Democracy, and National Security*, California Law Review, т. 107, № 6, 2019, с. 1753–1820. Источник концепции «дивиденда лжеца».'
          )

          # Add DOI for the APSR paper if it is not already shown near the entry.
          p=root/'17-SOURCES.md'
          t=p.read_text(encoding='utf-8')
          anchor='https://www.cambridge.org/core/journals/american-political-science-review/article/liars-dividend-can-politicians-claim-misinformation-to-evade-accountability/687FEE54DBD7ED0C96D72B26606AA073'
          if anchor in t and 'https://doi.org/10.1017/S0003055423001454' not in t:
              t=t.replace(anchor, anchor+'\nhttps://doi.org/10.1017/S0003055423001454')
              p.write_text(t,encoding='utf-8')
              print('added APSR DOI')

          # Precision hard gate.
          alltext='\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.md'))
          forbidden=[
            'Статья 9, устанавливающая требования к маркировке',
            'Статья 9 о маркировке информационных материалов',
            '**Robert Chesney, Danielle Keats Citron.**'
          ]
          bad=[x for x in forbidden if x in alltext]
          if bad:
              raise SystemExit(f'Forbidden stale wording remains: {bad}')
          PY
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Tighten final legal and bibliography precision for Ne ver golosu'
          git push
