name: Cleanup Ne ver golosu Latin terms final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-ne-ver-golosu-latin-final.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce unnecessary English in reader text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('ne-ver-golosu/manuscript')

          def repl_file(name, pairs):
              p = root / name
              text = p.read_text(encoding='utf-8')
              old = text
              for a,b in pairs:
                  text = text.replace(a,b)
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  print('changed', name)

          repl_file('11-BUSINESS.md', [
              ('рекомендации FBI', 'рекомендации ФБР'),
              ('около HK$200 млн', 'около 200 млн гонконгских долларов'),
          ])
          repl_file('16-APPENDICES.md', [
              ('**FBI / IC3**', '**ФБР / IC3**'),
              ('**FTC** — потребительские рекомендации', '**Федеральная торговая комиссия США** — потребительские рекомендации'),
              ('**INTERPOL / Europol**', '**Интерпол / Европол**'),
              ('**C2PA** — актуальная спецификация Content Credentials.', '**C2PA** — открытая техническая спецификация для проверяемых данных о происхождении цифрового контента; в книге используется версия 2.4.'),
          ])

          # Preserve the official product name only in two places:
          # 1) first explanatory introduction in chapter 12; 2) glossary entry in appendix 16.
          keep_intro = 'Коалиция по происхождению и подлинности контента (C2PA) развивает открытый технический стандарт Content Credentials.'
          keep_gloss = '**Content Credentials** —'

          for p in sorted(root.glob('*.md')):
              if p.name == '17-SOURCES.md':
                  continue
              text = p.read_text(encoding='utf-8')
              old = text
              text = text.replace(keep_intro, keep_intro.replace('Content Credentials', '__KEEP_CC_INTRO__'))
              text = text.replace(keep_gloss, keep_gloss.replace('Content Credentials', '__KEEP_CC_GLOSS__'))
              text = text.replace('Content Credentials', 'проверяемые данные о происхождении')
              text = text.replace('__KEEP_CC_INTRO__', 'Content Credentials')
              text = text.replace('__KEEP_CC_GLOSS__', 'Content Credentials')
              # Polish the known sentences after generic replacement.
              text = text.replace('В упрощённом виде запись проверяемые данные о происхождении содержит', 'В упрощённом виде такая запись содержит')
              text = text.replace('### проверяемые данные о происхождении не являются сертификатом правды', '### Проверяемые данные о происхождении не являются сертификатом правды')
              text = text.replace('Пусть запись проверяемые данные о происхождении показывает', 'Пусть проверяемая запись о происхождении показывает')
              text = text.replace('проверяемые данные о происхождении позволяют', 'Проверяемые данные о происхождении позволяют')
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  print('changed', p.name)

          # Hard gate: exactly two reader-facing occurrences remain.
          total = 0
          for p in root.glob('*.md'):
              if p.name == '17-SOURCES.md':
                  continue
              total += p.read_text(encoding='utf-8').count('Content Credentials')
          print('Content Credentials remaining:', total)
          if total != 2:
              raise SystemExit(f'Expected exactly 2 Content Credentials occurrences, got {total}')
          PY
      - name: Commit cleanup
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove unnecessary English terminology from Ne ver golosu'
          git push
