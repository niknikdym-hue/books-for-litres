name: Cleanup Ne ver golosu Latin terms final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-ne-ver-golosu-latin-final.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce unnecessary English in reader text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('ne-ver-golosu/manuscript')

          def edit(name, replacements):
              p = root / name
              text = p.read_text(encoding='utf-8')
              old = text
              for a,b in replacements:
                  if a not in text:
                      print(f'WARN missing in {name}: {a}')
                  text = text.replace(a,b)
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  print('changed', name)

          edit('07A-TRUST-CHAIN.md', [
              ('Content Credentials', 'проверяемых данных о происхождении'),
          ])

          edit('12-DETECTORS-PROVENANCE.md', [
              ('В упрощённом виде запись Content Credentials содержит', 'В упрощённом виде такая запись содержит'),
              ('### Content Credentials не являются сертификатом правды', '### Проверяемые данные о происхождении не являются сертификатом правды'),
              ('с безупречными Content Credentials', 'с безупречными проверяемыми данными о происхождении'),
              ('отсутствие Content Credentials', 'отсутствие проверяемых данных о происхождении'),
              ('Content Credentials дают **сигналы происхождения и целостности заявленной истории**', 'Проверяемые данные о происхождении дают **сигналы происхождения и целостности заявленной истории**'),
          ])

          edit('13A-PUBLIC-EVIDENCE.md', [
              ('Content Credentials позволяют', 'Проверяемые данные о происхождении позволяют'),
              ('Пусть запись Content Credentials показывает', 'Пусть проверяемая запись о происхождении показывает'),
              ('У файла нет Content Credentials — значит, фейк', 'У файла нет проверяемых данных о происхождении — значит, фейк'),
          ])

          edit('11-BUSINESS.md', [
              ('рекомендации FBI', 'рекомендации ФБР'),
              ('около HK$200 млн', 'около 200 млн гонконгских долларов'),
          ])

          edit('16-APPENDICES.md', [
              ('**FBI / IC3**', '**ФБР / IC3**'),
              ('**FTC** — потребительские рекомендации', '**Федеральная торговая комиссия США** — потребительские рекомендации'),
              ('**INTERPOL / Europol**', '**Интерпол / Европол**'),
              ('**C2PA** — актуальная спецификация Content Credentials.', '**C2PA** — открытая техническая спецификация для проверяемых данных о происхождении цифрового контента; в книге используется версия 2.4.'),
          ])

          # Reader text should retain the official English product name only at its first explanation and glossary entry.
          total = 0
          for p in root.glob('*.md'):
              if p.name == '17-SOURCES.md':
                  continue
              total += p.read_text(encoding='utf-8').count('Content Credentials')
          print('Content Credentials remaining:', total)
          if total > 2:
              raise SystemExit('Too many repeated Content Credentials occurrences remain')
          PY
      - name: Commit cleanup
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove unnecessary English terminology from Ne ver golosu'
          git push
