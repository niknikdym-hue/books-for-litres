name: Audit Ne ver golosu Latin terms

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_ne_ver_golosu_latin.py'
      - '.github/workflows/audit-ne-ver-golosu-latin.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all reader-facing manuscript files for Latin tokens
        run: python tools/audit_ne_ver_golosu_latin.py
