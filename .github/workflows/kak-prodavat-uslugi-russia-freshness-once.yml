name: How to Sell Services Russia Freshness Once

on:
  push:
    branches:
      - brain/kak-prodavat-uslugi-prewriting-research-20260907
    paths:
      - "sekrety-prodvizheniya-uslug/kak-prodavat-uslugi/quality/apply_russia_freshness_patch.py"
      - ".github/workflows/kak-prodavat-uslugi-russia-freshness-once.yml"

permissions:
  contents: write

jobs:
  patch:
    name: Apply exact NPD freshness correction
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact correction and re-run canonical BOOK_PROSE gate
        run: python sekrety-prodvizheniya-uslug/kak-prodavat-uslugi/quality/apply_russia_freshness_patch.py

      - name: Remove one-time patch machinery
        run: |
          rm -f sekrety-prodvizheniya-uslug/kak-prodavat-uslugi/quality/apply_russia_freshness_patch.py
          rm -f .github/workflows/kak-prodavat-uslugi-russia-freshness-once.yml

      - name: Commit corrected manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No correction produced"; exit 1; }
          git commit -m "Tighten Russia NPD receipt timing language"
          git push origin HEAD:${{ github.ref_name }}
