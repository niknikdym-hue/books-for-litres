name: Audit Ne ver golosu Latin words final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ne-ver-golosu-latin-final.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all reader-facing manuscript files for Latin tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          root = Path('ne-ver-golosu/manuscript')
          token_rx = re.compile(r"[A-Za-z][A-Za-z0-9’'._+-]*")
          counts = collections.Counter()
          contexts = collections.defaultdict(list)
          for p in sorted(root.glob('*.md')):
              if p.name == '17-SOURCES.md':
                  continue
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  # Strip URLs if any, then collect every remaining Latin token.
                  clean = re.sub(r'https?://\S+', '', line)
                  toks = token_rx.findall(clean)
                  for tok in toks:
                      counts[tok] += 1
                      if len(contexts[tok]) < 4:
                          contexts[tok].append(f'{p.name}:{n}: {line.strip()}')
          print('UNIQUE_LATIN_TOKENS', len(counts))
          for tok, cnt in sorted(counts.items(), key=lambda kv: kv[0].lower()):
              print(f'\nTOKEN {tok} x{cnt}')
              for ctx in contexts[tok]:
                  print(ctx)
          PY
