name: Final Ne ver golosu publicistic polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-publicistic-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace final stiff phrases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')
          changes={
            '00-PROLOG.md': [
              ('Подтверждение личности опирается на что-то ещё: известный заранее канал, независимый обратный звонок, корпоративную процедуру, второй фактор, подтверждение другого человека, официальный источник, проверяемая история происхождения материала — в зависимости от того, что именно поставлено на карту.',
               'А подтверждение начинается там, где само сообщение уже ничего не решает: вы сами перезваниваете по знакомому номеру, открываете официальный сервис, спрашиваете другого человека или проверяете источник — смотря что именно поставлено на карту.'),
              ('Этот принцип звучит почти скучно. И в этом его достоинство. Хорошая безопасность вообще редко похожа на детектив. Она похожа на процедуру, которую выполняют даже тогда, когда всё кажется очевидным.',
               'Этот принцип звучит почти скучно. И в этом его достоинство. Надёжность вообще редко похожа на детектив. Чаще это несколько простых действий, которые мы делаем даже тогда, когда всё кажется очевидным.')],
            '04-EVIDENCE.md': [
              ('Если «решение руководителя» — проходит ли оно установленную корпоративную процедуру?',
               'Если это «решение руководителя» — действительно ли такие распоряжения в компании принимаются именно так?'),
              ('И здесь снова работает простой принцип: хорошая процедура часто **убирает необходимость распознавать способ подделки**.',
               'И здесь снова работает простой принцип: заранее понятный порядок действий часто **убирает саму необходимость угадывать, как именно сделана подделка**.')],
            '11A-WHO-IS-REAL.md': [
              ('Хорошая процедура проверяет не только человека, но и его полномочия.',
               'Поэтому важно проверить не только, кто перед вами, но и имеет ли этот человек право просить именно это.'),
              ('Нужно уметь выйти из текущего контакта, независимо подтвердить человека и проверить, соответствует ли просьба его реальным полномочиям и обычной процедуре.',
               'Нужно уметь закончить сомнительный контакт, самостоятельно связаться с человеком и понять, нормальна ли сама просьба для него и для этой ситуации.')],
            '12-DETECTORS-PROVENANCE.md': [
              ('Если речь идёт о деньгах, доступе, документах или репутационно важном решении, нужна независимая процедура.',
               'Если речь идёт о деньгах, доступе, документах или репутации, одного анализа файла мало: важное решение лучше перепроверить отдельно.')],
            '13-DIGITAL-DOUBLE.md': [
              ('Парадокс показывает предел визуального ответа. В мире синтетического медиа опровержение должно опираться не только на **новое лицо на новом видео**, но и на устойчивые официальные каналы: верифицированные аккаунты, сайт организации, пресс-службу, подтверждение нескольких независимых источников, технические данные происхождения, а в серьёзных случаях — формальные процедуры.',
               'Парадокс показывает предел визуального ответа. В мире синтетического медиа опровержение должно опираться не только на **новое лицо на новом видео**, но и на то, что существовало до него: давно известный официальный аккаунт, сайт организации, пресс-службу, несколько независимых подтверждений, а если вред серьёзный — на обычные юридические и рабочие способы зафиксировать правду.')],
            '14-LIARS-DIVIDEND.md': [
              ('Если оно держится на происхождении, независимых каналах, процедурах, разделении полномочий и возможности проверки — оно становится сильнее, чем было в мире, где мы просто надеялись, что подделывать слишком дорого.',
               'Если доверие держится не на одном впечатлении, а на понятном источнике, независимой перепроверке и правилах, которые нельзя отменить одним авторитетным голосом, оно становится сильнее, чем было в мире, где мы просто надеялись, что подделывать слишком дорого.')]
          }
          changed=[]
          for name,pairs in changes.items():
            p=root/name
            t=p.read_text(encoding='utf-8')
            before=t
            for old,new in pairs:
              if old not in t:
                raise SystemExit(f'Missing exact phrase in {name}: {old[:160]}')
              t=t.replace(old,new)
            if t!=before:
              p.write_text(t,encoding='utf-8')
              changed.append(name)
          print('CHANGED', changed)
          PY
          git diff --check
      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Polish final publicistic wording in Ne ver golosu'
          git push
