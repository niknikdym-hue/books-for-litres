name: Normalize Ne ver golosu reader language

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize_ne_ver_golosu_reader_language.py'
      - '.github/workflows/normalize-ne-ver-golosu-reader-language.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize English jargon in reader-facing text
        run: python tools/normalize_ne_ver_golosu_reader_language.py
      - name: Validate diff
        run: git diff --check
      - name: Commit normalized manuscript
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Normalize reader-facing English terminology'
          git push
