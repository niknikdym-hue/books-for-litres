name: Normalize Ne ver golosu terminology

on:
  push:
    paths:
      - 'tools/normalize_ne_ver_golosu_terms.py'
      - '.github/workflows/normalize-ne-ver-golosu-terms.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize terminology
        run: python tools/normalize_ne_ver_golosu_terms.py

      - name: Validate diff
        run: git diff --check

      - name: Commit normalized manuscript
        run: |
          if git diff --quiet; then
            echo 'No terminology changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript ne-ver-golosu/04-STYLE-FACTCHECK-SAFETY.md
          git commit -m 'Normalize English terminology in Ne ver golosu'
          git push
