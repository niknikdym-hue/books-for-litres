            ('**Федеральный закон от 27.07.2006 №152-ФЗ «О персональных данных»**, редакция от 26.07.2026 на дату проверки. В частности, ст. 7, 9, 11.\nhttps://www.consultant.ru/document/cons_doc_LAW_61801/',
