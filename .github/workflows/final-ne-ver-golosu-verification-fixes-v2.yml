            ('**Федеральный закон от 02.05.2026 № 130-ФЗ «О внесении изменений в отдельные законодательные акты Российской Федерации».** Закон вступил в силу 2 мая 2026 года; соответствующие изменения избирательного законодательства применяются к правоотношениям, связанным с выборами и референдумами, назначенными после этой даты. В агитационных материалах введено специальное регулирование использования изображения и воспроизведения голоса, включая материалы, созданные с применением информационных технологий. Это узкий режим избирательной агитации и не создаёт универсального гражданско-правового «права на голос».\nhttps://www.consultant.ru/document/cons_doc_LAW_533418/',
