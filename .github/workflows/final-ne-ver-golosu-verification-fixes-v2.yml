            ('**Федеральный закон от 26.07.2026 № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации».** На дату фактологического среза 14 августа 2026 года закон подписан и опубликован, но ещё не вступил в силу. Основные положения вступают в силу 1 сентября 2026 года; статьи 8–10, включая требования к маркировке информационных материалов, созданных с применением больших фундаментальных моделей искусственного интеллекта, — 1 марта 2027 года.\nhttps://www.consultant.ru/document/cons_doc_LAW_540336/',
             '**Федеральный закон от 26.07.2026 № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации».** На дату фактологического среза 14 августа 2026 года закон подписан и опубликован, но ещё не вступил в силу. По статье 13 основная часть закона вступает в силу 1 сентября 2026 года. Статья 9 о маркировке информационных материалов, созданных с применением больших фундаментальных моделей искусственного интеллекта, а также другие положения, перечисленные в части 2 статьи 13, вступают в силу 1 марта 2027 года.\nОфициальная публикация в «Российской газете»: https://rg.ru/documents/2026/07/31/fz243-dok.html\nТекст закона: https://www.consultant.ru/document/cons_doc_LAW_540336/'),
