                      text=text.replace(a,b)
                  else:
                      print('INFO already absent or changed:', name, a[:90])
              if text!=old:
                  p.write_text(text,encoding='utf-8')
                  changed.append(name)

          alltext='\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.md'))
          forbidden=[
            'без проверяемые данные',
            'с безупречными проверяемые данные',
            'отсутствие проверяемые данные',
            'У файла нет проверяемые данные',
            'вход → подтверждение легенды → перенос → изоляция → действие',
            'Я сейчас без связи. Срочно выгрузи базу клиентов',
            'Вот письмо директора — переведите',
            'Подросток получает голосовое от «мамы»: срочно пришли код',
            'Позвоните моему новому помощнику',
            'Мошенничество часто выигрывает, потому что эти три вопроса сливаются',
            'скинь мастеру ещё 30 тысяч',
            'срочно пришли код подтверждения',
          ]
          bad=[x for x in forbidden if x in alltext]
          if bad:
              print('FORBIDDEN REMAINS:',bad)
              raise SystemExit(2)
          print('changed:', ', '.join(changed))
          PY
          git diff --check
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Final protective and source verification fixes for Ne ver golosu'
          git push
