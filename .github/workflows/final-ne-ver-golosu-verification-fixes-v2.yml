          '17-SOURCES.md': [
            ('**Government of Hong Kong, FBI и INTERPOL** — те же первичные материалы, перечисленные выше и ниже. Они используются не для создания «инструкции атаки», а для подтверждения принципиально важного факта: реальная имперсонация может складываться из нескольких каналов и технологий — обычного письма, видеоконференции, мессенджера, синтетического голоса или видео и последующих сообщений.\n\nПредложенная в книге последовательность «вход → подтверждение легенды → перенос → изоляция → действие» является **авторской аналитической моделью**, а не официальной классификацией FBI, INTERPOL или полиции Гонконга.',
