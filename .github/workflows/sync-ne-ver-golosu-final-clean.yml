name: Sync Ne ver golosu final clean prose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ne-ver-golosu-final-clean.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final literary cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          repl = {
          'ne-ver-golosu/manuscript/00-PROLOG.md': [
          ('''Дальше разговор быстро подводит к срочной просьбе о помощи и требованию никому пока не звонить. Для защитного решения важны не подробности этой истории, а сочетание знакомого голоса, давления временем и запрета на независимую проверку.''',
           '''Дальше разговор быстро сводится к срочной просьбе о помощи и требованию никому пока не звонить. Важны здесь не подробности истории, а сочетание знакомого голоса, давления временем и запрета всё перепроверить самостоятельно.'''),
          ('''Мы начнём с голоса — самого интимного и потому самого опасно убедительного сигнала. Потом разберём лицо, переписку, фотографии и документы. Посмотрим, почему срочность, секретность и знание контекста должны включать защитную паузу и независимую проверку независимо от качества нейросети. Затем соберём новую систему доверия для семьи и бизнеса. Наконец, выйдем за пределы финансового мошенничества: к цифровым двойникам, репутации, праву на собственное лицо и к парадоксальной проблеме, когда существование подделок позволяет объявить подделкой настоящее.''',
           '''Мы начнём с голоса — самого интимного и потому самого опасно убедительного сигнала. Потом разберём лицо, переписку, фотографии и документы. Посмотрим, почему срочность, секретность и знание контекста — повод остановиться и перепроверить всё, даже если голос или видео кажутся безупречными. Затем поговорим о том, как договориться о проверке в семье и на работе. Наконец, выйдем за пределы финансового мошенничества: к цифровым двойникам, репутации, праву на собственное лицо и к парадоксальной проблеме, когда существование подделок позволяет объявить подделкой настоящее.''')],
          'ne-ver-golosu/manuscript/02-FACE.md': [
          ('''Практический вывод из сложного стандарта очень простой:''','''Из сложного стандарта следует очень простая вещь:''')],
          'ne-ver-golosu/manuscript/04-EVIDENCE.md': [
          ('''Особенно опасен момент, когда изображение используется как единственное основание для действия в другой системе: передачи товара по изображению оплаты, проведения платежа по снимку распоряжения, раскрытия данных по присланному документу или установки программы по скриншоту якобы банковского сообщения. Здесь защитное правило одно: сначала проверить событие или распоряжение в исходной системе либо по независимо известному каналу.''',
           '''Особенно опасен момент, когда изображение становится единственным основанием для действия: товар отдают по картинке оплаты, платёж проводят по снимку распоряжения, данные раскрывают по присланному документу. Здесь правило одно: сначала проверить само событие там, где оно действительно должно было произойти, или связаться с человеком по знакомому контакту.''')],
          'ne-ver-golosu/manuscript/11A-WHO-IS-REAL.md': [
          ('''Но эти действия отвечают на разные вопросы. И именно здесь возникает одна из самых важных защитных привычек: не смешивать личность, доступ, полномочия и решение.''',
           '''Но эти действия отвечают на разные вопросы. И здесь особенно важно не смешивать личность, доступ, полномочия и само решение.''')],
          'ne-ver-golosu/manuscript/13-DIGITAL-DOUBLE.md': [
          ('''Здесь в российском гражданском праве появляется другой слой — защита чести, достоинства и деловой репутации по статье 152 ГК РФ. Норма предусматривает способы защиты в отношении не соответствующих действительности сведений при установленных законом условиях, в том числе возможности требования опровержения и, для интернета, удаления соответствующей информации в предусмотренных случаях.''',
           '''Здесь российское гражданское право даёт ещё один инструмент — защиту чести, достоинства и деловой репутации по статье 152 ГК РФ. При установленных законом условиях можно, в частности, требовать опровержения, а для материалов в интернете — удаления соответствующей информации.'''),
          ('''Практический вывод из этой юридической сложности парадоксально простой: если чужой цифровой материал говорит вашим голосом, не пытайтесь самостоятельно выбрать одну статью закона по первой публикации в интернете. Сначала зафиксируйте факт и масштаб распространения. Затем решайте правовой маршрут с учётом конкретной ситуации.''',
           '''Из всей этой юридической сложности следует простая вещь: если чужой цифровой материал говорит вашим голосом, не пытайтесь самостоятельно подобрать одну статью закона по первой публикации в интернете. Сначала зафиксируйте, что именно появилось и как широко это разошлось, а затем уже решайте со специалистом, какие правовые шаги подходят именно вашей ситуации.'''),
          ('''Если ущерб серьёзный — финансовый, репутационный, интимный, профессиональный — имеет смысл как можно раньше получить юридическую помощь применительно к конкретной юрисдикции и обстоятельствам. Если есть признаки преступления, обращение к правоохранительным органам — отдельный маршрут. Если атака связана с деньгами или банковскими операциями, необходимо связываться с банком через официальные каналы, не дожидаясь завершения публичного спора.''',
           '''Если ущерб серьёзный — финансовый, репутационный, интимный, профессиональный — лучше как можно раньше получить юридическую помощь с учётом конкретной страны и обстоятельств. Если есть признаки преступления, нужно отдельно обратиться в правоохранительные органы. Если дело связано с деньгами или банковскими операциями, нужно сразу связаться с банком по его официальным контактам, не дожидаясь завершения публичного спора.'''),
          ('''Здесь работает тот же принцип: важнее не победить фейк эстетически, а восстановить независимую точку доверия.''',
           '''Здесь важнее не победить фейк красивым опровержением, а вернуть людям понятный и привычный способ убедиться, где действительно говорите вы.'''),
          ('''Способы создания такого контента не важны для защиты. Достаточно увидеть принципиальную перемену: раньше защита интимной приватности часто связывалась с контролем над существующей записью. Теперь вред может возникнуть и при отсутствии оригинальной записи вообще.''',
           '''Способы создания такого контента здесь вторичны. Важнее другое: раньше защита интимной приватности чаще связывалась с контролем над существующей записью. Теперь вред может возникнуть даже тогда, когда никакой оригинальной записи никогда не было.'''),
          ('''Российская статья 152.2 ГК РФ защищает информацию о частной жизни при установленных законом условиях. Снова важны конкретные обстоятельства, но для нашей интеллектуальной карты это существенный слой: ложная форма не делает реальные личные сведения безвредными.''',
           '''Российская статья 152.2 ГК РФ защищает информацию о частной жизни при установленных законом условиях. И здесь важнее не юридическая схема, а простая вещь: ложная форма не делает реальные личные сведения безвредными.''')],
          'ne-ver-golosu/manuscript/13A-PUBLIC-EVIDENCE.md': [
          ('''Один из таких стандартов развивает C2PA. Его пользовательское название — Content Credentials.''',
           '''Один из таких стандартов развивает C2PA.'''),
          ('''В финансовой ситуации защитная граница обычно видна: рано или поздно возникает конкретное действие.''',
           '''В финансовой ситуации момент, когда нужно остановиться, обычно заметен: рано или поздно возникает конкретное действие.''')],
          'ne-ver-golosu/manuscript/14-LIARS-DIVIDEND.md': [
          ('''### Почему происхождение становится общественной инфраструктурой''',
           '''### Почему всё чаще важно знать, откуда взялся материал''')],
          'ne-ver-golosu/manuscript/16-APPENDICES.md': [
          ('''**Content Credentials (C2PA)** — официальное название технологии, которая позволяет сохранять и проверять сведения о происхождении и изменениях цифрового материала. Наличие таких данных не делает содержание автоматически истинным, а их отсутствие не доказывает подделку.''',
           '''**Content Credentials** — название технологии C2PA для сохранения и проверки сведений о происхождении и изменениях цифрового материала. Наличие таких данных не делает содержание автоматически истинным, а их отсутствие не доказывает подделку.''')],
          }

          changed = 0
          for file, pairs in repl.items():
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'MISSING exact phrase in {file}: {old[:100]}')
                  s = s.replace(old, new, 1)
                  changed += 1
              p.write_text(s, encoding='utf-8')
          print('replacements', changed)
          PY
      - name: Commit synchronized prose
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Finalize publicistic prose in Ne ver golosu'
          git push
