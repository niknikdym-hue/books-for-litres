name: Clean Ne ver golosu editorial jargon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-ne-ver-golosu-editorial-jargon.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace editorial/meta phrasing with natural prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')
          changes={
          '00-PROLOG.md': [
            ('Поэтому эта книга не будет учить вас выигрывать в игру «угадай, настоящее ли лицо».',
             'Поэтому не нужно учиться выигрывать в игру «угадай, настоящее ли лицо».')],
          '01-VOICE.md': [
            ('Для защитной логики не так важно, сколько именно секунд исходного аудио потребовалось конкретному сервису в конкретном году.',
             'Не так важно, сколько именно секунд исходного аудио потребовалось конкретному сервису в конкретном году.')],
          '02-FACE.md': [
            ('Чтобы понять защитный вывод, достаточно подтверждённого факта:',
             'Здесь достаточно подтверждённого факта:'),
            ('Мы ещё вернёмся к этому различию в главе о цифровом происхождении. Пока достаточно одного вывода:',
             'Пока достаточно одного вывода:'),
            ('Для читателя важна не реконструкция преступной последовательности, а место, где контроль мог бы остановить ущерб:',
             'Важна не реконструкция преступной последовательности, а место, где контроль мог бы остановить ущерб:')],
          '03-MESSAGES.md': [
            ('Для читателя этой книги не важно знать способы захвата аккаунта. Важно изменить грамматику доверия.',
             'Знать способы захвата аккаунта не нужно. Важно изменить грамматику доверия.')],
          '05-DECISION.md': [
            ('Практический вывод для читателя прост:',
             'Практический вывод прост:'),
            ('Пока книга о дипфейках обсуждает только качество синтеза, она оставляет читателя в пассивной роли.',
             'Если обсуждать только качество синтеза, человек остаётся в пассивной роли.')],
          '07-KNOWLEDGE.md': [
            ('Защитный вывод простой:', 'Вывод простой:')],
          '07A-TRUST-CHAIN.md': [
            ('Защитный вывод из них один —', 'Вывод один —'),
            ('Защитный вывод:', 'Вывод:'),
            ('Эта модель описывает не ход мошенничества, а действия защищающегося человека.',
             'Здесь речь не о ходе мошенничества, а о действиях человека, который защищается.')],
          '08-EXIT-CHANNEL.md': [
            ('Первые семь глав объясняли, почему привычные признаки подлинности ослабли: голос можно синтезировать, лицо — подменить, стиль — воспроизвести, аккаунт — скомпрометировать, биографические подробности — узнать. Если после этого оставить читателя с задачей «определите, настоящий ли собеседник», мы только сделали её страшнее.',
             'Привычные признаки подлинности ослабли: голос можно синтезировать, лицо — подменить, стиль — воспроизвести, аккаунт — скомпрометировать, биографические подробности — узнать. Если после этого по-прежнему пытаться решить задачу «определите, настоящий ли собеседник», она становится только страшнее.')],
          '09-RISK.md': [
            ('Если после этой книги вы начнёте проверять подлинность каждого сообщения, я буду считать это поражением.',
             'Проверять подлинность каждого сообщения — не цель. Это только создаст постоянное напряжение.')],
          '12-DETECTORS-PROVENANCE.md': [
            ('На дату этой книги актуальна спецификация 2.4, опубликованная в апреле 2026 года.',
             'На август 2026 года актуальна спецификация 2.4, опубликованная в апреле 2026 года.')],
          '13-DIGITAL-DOUBLE.md': [
            ('Однако книга не должна обещать, что любая синтетическая обработка автоматически подпадает под одну конкретную статью и гарантирует один исход спора.',
             'Однако нельзя считать, что любая синтетическая обработка автоматически подпадает под одну конкретную статью и гарантирует один исход спора.'),
            ('На дату фактологического среза книги отдельного универсального «права на голос», полностью зеркального статье 152.1 ГК РФ, нет.',
             'По состоянию на 14 августа 2026 года отдельного универсального «права на голос», полностью зеркального статье 152.1 ГК РФ, нет.'),
            ('Федеральный закон от 26 июля 2026 года № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации» на дату фактологического среза, 14 августа 2026 года, ещё не вступил в силу.',
             'Федеральный закон от 26 июля 2026 года № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации» по состоянию на 14 августа 2026 года ещё не вступил в силу.'),
            ('Поэтому в этой книге эти положения не описываются как действующие нормы.',
             'Поэтому эти положения пока нельзя описывать как действующие нормы.'),
            ('Смысл для читателя не в перечислении статей.',
             'Смысл не в перечислении статей.')],
          '14-LIARS-DIVIDEND.md': [
            ('Это важная граница. Книга о кризисе доверия не должна сама убеждать читателя, что доверие уже полностью исчезло.',
             'Это важная граница. Разговор о кризисе доверия не должен приводить к выводу, что доверие уже полностью исчезло.')],
          '16-APPENDICES.md': [
            ('Репутационный, интимный, финансовый и уголовно-правовой контекст может требовать разных действий. Российская правовая рамка на дату фактологического среза включает, среди прочего, нормы ГК РФ о репутации, изображении и частной жизни и нормы законодательства о персональных данных. Конкретная применимость зависит от ситуации.',
             'Репутационный, интимный, финансовый и уголовно-правовой контекст может требовать разных действий. По состоянию на 14 августа 2026 года российское право включает, среди прочего, нормы ГК РФ о репутации, изображении и частной жизни и нормы законодательства о персональных данных. Конкретная применимость зависит от ситуации.'),
            ('## Приложение 7. Словарь без техножаргона',
             '## Приложение 7. Краткий словарь')],
          }
          changed=[]
          for name,pairs in changes.items():
              p=root/name
              t=p.read_text(encoding='utf-8')
              before=t
              for old,new in pairs:
                  if old not in t:
                      raise SystemExit(f'Missing exact phrase in {name}: {old[:120]}')
                  t=t.replace(old,new)
              if t!=before:
                  p.write_text(t,encoding='utf-8')
                  changed.append(name)
          print('CHANGED',len(changed),changed)
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Remove editorial jargon from Ne ver golosu'
          git push
