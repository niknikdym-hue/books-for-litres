name: Audit Ne ver golosu publicistic tone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ne-ver-golosu-publicistic-tone.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for bureaucratic and security-manual tone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          root=Path('ne-ver-golosu/manuscript')
          files=sorted(p for p in root.glob('*.md') if p.name!='17-SOURCES.md')
          patterns=[
            r'(?i)высокорисков', r'(?i)процедур', r'(?i)протокол', r'(?i)регламент', r'(?i)контроль',
            r'(?i)канал', r'(?i)сигнал', r'(?i)сло[йяе]', r'(?i)механизм', r'(?i)процесс', r'(?i)систем',
            r'(?i)оператор', r'(?i)доступ', r'(?i)полномоч', r'(?i)инцидент', r'(?i)вериф', r'(?i)валидац',
            r'(?i)проверяем(?:ый|ая|ое|ые)', r'(?i)риск', r'(?i)структур', r'(?i)контекст операции',
            r'(?i)техническ', r'(?i)защитн', r'(?i)идентич', r'(?i)подтверждени[ея] личности'
          ]
          rx=[re.compile(x) for x in patterns]
          score=collections.Counter()
          lines=[]
          for p in files:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if not line.strip(): continue
              c=sum(bool(r.search(line)) for r in rx)
              if c>=2:
                score[p.name]+=c
                lines.append((c,p.name,n,line))
          print('TOP_FILES')
          for name,val in score.most_common(): print(val,name)
          print('\nHEAVY_LINES')
          for c,name,n,line in sorted(lines, reverse=True)[:180]:
            print(f'{c}\t{name}:{n}\t{line}')
          PY
