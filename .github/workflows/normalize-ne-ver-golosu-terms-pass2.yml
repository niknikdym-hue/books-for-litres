name: Normalize Ne ver golosu terminology pass 2

on:
  push:
    paths:
      - 'tools/normalize_ne_ver_golosu_terms_pass2.py'
      - '.github/workflows/normalize-ne-ver-golosu-terms-pass2.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize terminology
        run: python tools/normalize_ne_ver_golosu_terms_pass2.py

      - name: Validate diff
        run: git diff --check

      - name: Commit normalized manuscript
        run: |
          if git diff --quiet; then
            echo 'No terminology changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Finish terminology cleanup in Ne ver golosu'
          git push
