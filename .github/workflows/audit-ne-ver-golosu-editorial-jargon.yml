name: Audit Ne ver golosu editorial jargon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ne-ver-golosu-editorial-jargon.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Broad scan for editorial/meta language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('ne-ver-golosu/manuscript')
          files=sorted(p for p in root.glob('*.md') if p.name!='17-SOURCES.md')
          pat=re.compile(r'(?i)(?:книг[аеуи]|читател|авторск|фактолог|технож|жаргон|рамк|логик|модел|архитектур|контур|методолог|редактор|служеб|срез|в этой главе|в этой части|в этом разделе|мы ещё|мы уже|далее|ниже|выше|в следующей главе)')
          total=0
          for p in files:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if pat.search(line):
                total+=1
                print(f'@@ {p.name}:{n}')
                print(line)
          print('TOTAL_BROAD_CANDIDATES',total)
          PY
