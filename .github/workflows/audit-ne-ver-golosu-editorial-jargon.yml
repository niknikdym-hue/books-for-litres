name: Audit Ne ver golosu editorial jargon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ne-ver-golosu-editorial-jargon.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source notes for editorial/meta language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ne-ver-golosu/manuscript/17-SOURCES.md')
          pat=re.compile(r'(?i)(?:кейс|артефакт|риск-модел|фрейм|воронк|контур|операционн|методолог|редакторск|служебн|технож|жаргон|фактологическ|авторск|рамк|интеллектуальн(?:ая|ой) опор|для читател|этой книг|в этой книг|книг[аеуи] |вывод книг|модель книг)')
          total=0
          for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if pat.search(line):
                  total+=1
                  print(f'@@ {p.name}:{n}')
                  print(line)
          print('TOTAL_SOURCE_CANDIDATES',total)
          PY
