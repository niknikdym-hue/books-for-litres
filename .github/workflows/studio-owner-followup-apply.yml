name: Apply Studio owner follow-up fixes

on:
  push:
    branches:
      - brain/content-quality-lexicon-v1

permissions:
  contents: write

concurrency:
  group: studio-owner-followup-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic follow-up patch
        run: python tools/fix_studio_owner_followup.py
      - name: Verify focused contracts
        working-directory: audiobook-studio
        run: |
          python -m unittest tests.test_book_sound_design -v
          python -m unittest tests.test_owner_production_flow_source -v
          python -m unittest tests.test_dilon_identity -v
          python -m unittest tests.test_dilon_opening_credit_prepare -v
          git diff --check
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "Audiobook Studio Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add audiobook-studio/chapter_assembly.py audiobook-studio/tests audiobook-studio/docs/AUDIOBOOK-STUDIO-CURRENT-STATE.md
          git commit -m "Preserve legacy chapter identity and update Dilon stress evidence"
          git push origin HEAD:brain/content-quality-lexicon-v1
