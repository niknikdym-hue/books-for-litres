name: Clean Ne ver golosu glossary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-ne-ver-golosu-glossary.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify glossary and appendix wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ne-ver-golosu/manuscript/16-APPENDICES.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('- предупредите его, если выяснилось, что используется имперсонация;', '- предупредите его, если кто-то выдаёт себя за него;')
          t=t.replace('Используйте механизмы для имперсонации, нарушения приватности, незаконного изображения или иные применимые категории.', 'Используйте подходящие категории жалоб: выдача себя за другого человека, нарушение приватности, незаконное использование изображения и другие доступные основания.')
          t=t.replace('Свяжитесь с банком/организацией по официальному каналу и одновременно ограничьте скомпрометированные учётные записи.', 'Свяжитесь с банком или организацией по официальному каналу и одновременно ограничьте доступ к учётным записям, которыми мог воспользоваться посторонний.')
          start=t.index('## Приложение 7. Краткий словарь')
          end=t.index('\n---\n\n## Приложение 8.', start)
          block=(
            '## Приложение 7. Краткий словарь\n\n'
            '**Синтетический контент** — текст, изображение, аудио или видео, полностью или частично созданные генеративной системой.\n\n'
            '**Дипфейк** — созданный или существенно изменённый материал, который убедительно показывает человека или событие не так, как они происходили в действительности. В разных источниках границы термина могут различаться.\n\n'
            '**Клонирование голоса** — синтез речи, имитирующей голос конкретного человека.\n\n'
            '**Социальная инженерия** — психологическое воздействие, которое побуждает человека самому передать информацию, доступ или совершить рискованное действие.\n\n'
            '**Независимый канал** — способ проверки, который вы выбрали сами и которому доверяли до подозрительного сообщения.\n\n'
            '**Проверяемая история происхождения** — сведения о том, откуда появился цифровой материал и какие изменения с ним происходили. Они помогают установить историю файла, но не доказывают истинность всего содержания.\n\n'
            '**Content Credentials (C2PA)** — официальное название технологии, которая позволяет сохранять и проверять сведения о происхождении и изменениях цифрового материала. Наличие таких данных не делает содержание автоматически истинным, а их отсутствие не доказывает подделку.\n\n'
            '**Дивиденд лжеца** — возможность объявить настоящее компрометирующее свидетельство подделкой, пользуясь тем, что убедительные дипфейки действительно существуют.\n'
          )
          t=t[:start]+block+t[end:]
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript/16-APPENDICES.md
          git commit -m 'Simplify glossary in Ne ver golosu'
          git push
