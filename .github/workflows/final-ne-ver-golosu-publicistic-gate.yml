name: Final Ne ver golosu publicistic gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-publicistic-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check final reader text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          root=Path('ne-ver-golosu/manuscript')
          files=sorted(p for p in root.glob('*.md') if p.name!='17-SOURCES.md')
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          low=text.lower()
          forbidden=[
            'атака с внедрением цифрового медиапотока','цифрового медиапотока','техножаргон',
            'фактологический срез','авторская модель','риск-модель','архитектурный вопрос',
            'аутентификац','аутентификатор','авторизац','имперсонац','компрометац',
            'фишинг-устойчив','проверка живого присутствия','манифест','валидатор','генерализация детектор',
            'высокорисков','риск-процедур','семейный протокол','деловой протокол','контрольная точка',
            'канал коммуникации','финальный контроль','класс риска','уровень риска','уровень проверки'
          ]
          hits=[]
          for p in files:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              l=line.lower()
              for term in forbidden:
                if term in l: hits.append(f'{p.name}:{n}:{term} :: {line}')
          banned_en=['authenticity','detection','identity proofing','liveness','provenance','human-in-the-loop','forensic','false positive','false negative',"liar's dividend",'generative ai','deepfake detection']
          bad_en=[x for x in banned_en if x in low]
          tokens=collections.Counter()
          rx=re.compile(r"[A-Za-z][A-Za-z0-9’'._+-]*")
          for p in files:
            for line in p.read_text(encoding='utf-8').splitlines():
              line=re.sub(r'https?://\S+','',line)
              tokens.update(rx.findall(line))
          allowed={'NIST','NIST.','SP','A-4','B-4','C2PA','C2PA.','Content','Credentials','Credentials.','PDF','PDF.','PDF-','WhatsApp','WhatsApp.','WhatsApp-','IC3','IC3.','I.','II.','III.','IV.'}
          unexpected=sorted(t for t in tokens if t not in allowed)
          operational=[]
          pats=[
            r'(?i)(?:мошенник|злоумышленник|атакующий)[^.!?]{0,150}(?:нужно|достаточно|должен|следует|выгодно|получить|обойти|скрыть|маскировать)',
            r'(?i)(?:как|способ)[^.!?]{0,100}(?:взломать|захватить|скомпрометировать|клонировать|подделать|обойти защит)'
          ]
          for p in files:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(re.search(pat,line) for pat in pats): operational.append(f'{p.name}:{n}:{line}')
          required=['## Приложение 7. Краткий словарь','**Content Credentials (C2PA)**','Подлинность не равна истинности.','**Не проверяйте, похож ли человек на настоящего. Проверяйте, действительно ли это он.**']
          missing=[x for x in required if x not in text]
          print('FORBIDDEN_TONE_OR_TECH')
          for x in hits: print(x)
          print('BANNED_ENGLISH',bad_en)
          print('UNEXPECTED_LATIN',unexpected)
          print('ATTACKER_SIDE_OPERATIONAL',operational)
          print('MISSING_REQUIRED',missing)
          failures=[]
          if hits: failures.append('reader tone/technical jargon')
          if bad_en: failures.append('English jargon')
          if unexpected: failures.append('unexpected Latin')
          if operational: failures.append('attacker-side operational framing')
          if missing: failures.append('required reader wording')
          print('FINAL_FAILURES',failures)
          if failures: raise SystemExit(1)
          PY
