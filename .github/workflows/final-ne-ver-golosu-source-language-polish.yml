name: Final Ne ver golosu source language polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-source-language-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish source organization names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ne-ver-golosu/manuscript/17-SOURCES.md')
          t=p.read_text(encoding='utf-8')
          pairs=[
            ('**Federal Trade Commission (FTC).**', '**Федеральная торговая комиссия США.**'),
            ('**FTC.** *Scammers use AI to enhance their family emergency schemes*', '**Федеральная торговая комиссия США.** *Scammers use AI to enhance their family emergency schemes*'),
            ('**FTC.** Материалы конкурса Voice Cloning Challenge', '**Федеральная торговая комиссия США.** Материалы конкурса *Voice Cloning Challenge*'),
            ('**Government of the Hong Kong Special Administrative Region.**', '**Правительство Специального административного района Гонконг.**'),
            ('**Federal Bureau of Investigation (FBI).**', '**Федеральное бюро расследований США (ФБР).**'),
            ('**Coalition for Content Provenance and Authenticity (C2PA).**', '**Коалиция по происхождению и подлинности контента (C2PA).**'),
            ('**FTC.** Рекомендации по мошенничеству под видом чрезвычайной ситуации в семье', '**Федеральная торговая комиссия США.** Рекомендации по мошенничеству под видом чрезвычайной ситуации в семье'),
            ('**FBI.** *Business Email Compromise.*', '**ФБР.** *Business Email Compromise.*'),
            ('актуальные материалы NIST, FTC, FBI/IC3, INTERPOL/Europol, C2PA', 'актуальные материалы NIST, Федеральной торговой комиссии США, ФБР/IC3, Интерпола/Европола, C2PA'),
          ]
          for old,new in pairs:
            if old not in t:
              raise SystemExit(f'Missing expected source text: {old}')
            t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          # Exact bibliographic titles/standards/products remain in original language; explanatory organization names should not.
          forbidden=['Federal Trade Commission (FTC)','Federal Bureau of Investigation (FBI)','Government of the Hong Kong Special Administrative Region','Coalition for Content Provenance and Authenticity (C2PA)','актуальные материалы NIST, FTC, FBI/IC3, INTERPOL/Europol, C2PA']
          bad=[s for s in forbidden if s in t]
          if bad: raise SystemExit(f'Unnecessary English organization names remain: {bad}')
          PY
          git diff --check
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript/17-SOURCES.md
          git commit -m 'Polish source language in Ne ver golosu'
          git push
