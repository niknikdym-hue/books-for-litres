name: Brain one-shot Content Quality UI mount

on:
  push:
    branches:
      - brain/content-quality-lexicon-v1

permissions:
  contents: write

jobs:
  mount:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Mount Content Quality panel in Studio flow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/content-quality-lexicon-v1
          fetch-depth: 0
      - name: Apply exact one-shot source mount
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('audiobook-studio/native/AudiobookStudioApp.swift')
          text = path.read_text(encoding='utf-8')
          mounted = '                        ContentQualitySettingsPanel(selectedBookID: book.id)'
          if mounted in text:
              print('Content Quality panel already mounted')
          else:
              lines = text.splitlines()
              target = '                    Section("Подготовка озвучки") {'
              positions = [index for index, line in enumerate(lines) if line == target]
              if len(positions) != 1:
                  raise SystemExit(f'expected exactly one voice-preparation section, found {len(positions)}')
              section_index = positions[0]
              if section_index < 5 or lines[section_index - 1] != '':
                  raise SystemExit('unexpected source shape before voice-preparation section')
              if lines[section_index - 2] != '                    }':
                  raise SystemExit('production-book scope closing brace not found')
              if lines[section_index - 3] != '                        }':
                  raise SystemExit('text-preparation section closing brace not found')
              insert_at = section_index - 2
              lines[insert_at:insert_at] = [mounted, '']
              updated = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              if updated.count(mounted) != 1:
                  raise SystemExit('mount did not produce exactly one panel')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit only the mounted source if changed
        run: |
          if git diff --quiet -- audiobook-studio/native/AudiobookStudioApp.swift; then
            exit 0
          fi
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "audiobook-studio/native/AudiobookStudioApp.swift"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiobook-studio/native/AudiobookStudioApp.swift
          git commit -m "Mount Content Quality panel in Studio flow"
          git push origin HEAD:brain/content-quality-lexicon-v1
