name: Brain one-shot Content Quality execution wiring

on:
  push:
    branches:
      - brain/content-quality-lexicon-v1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Wire Content Quality into provider execution paths')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/content-quality-lexicon-v1
          fetch-depth: 0
      - name: Apply exact provider/model wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          # Yandex chapter service: optional guard preserves direct low-level contracts,
          # real app injects it. Revalidation is repeated while shared CQ locks are held
          # across the complete chapter execution.
          path = Path('audiobook-studio/chapter_production.py')
          text = path.read_text(encoding='utf-8')
          if 'self.content_quality_guard = content_quality_guard' not in text:
              text = replace_once(text,
                  '''        now: Callable[[], datetime] | None = None,\n    ) -> None:''',
                  '''        now: Callable[[], datetime] | None = None,\n        content_quality_guard: Callable[[str], Any] | None = None,\n    ) -> None:''',
                  'yandex constructor signature')
              text = replace_once(text,
                  '''        self._now = now or (lambda: datetime.now(timezone.utc))\n\n    def _load_chapter''',
                  '''        self._now = now or (lambda: datetime.now(timezone.utc))\n        self.content_quality_guard = content_quality_guard\n\n    def _content_quality_status(self, book_name: str) -> tuple[dict[str, Any] | None, list[str]]:\n        if self.content_quality_guard is None:\n            return None, []\n        try:\n            with self.content_quality_guard(book_name) as evidence:\n                result = dict(evidence)\n        except Exception as error:\n            code = str(getattr(error, "code", "content_quality_blocked"))\n            return {\n                "schema_version": 1,\n                "state": "BLOCKED",\n                "blockers": [code],\n                "provider_requests": 0,\n                "remote_request_sent": False,\n                "model_calls": 0,\n                "paid_execution": False,\n                "billing_changed": False,\n            }, [code]\n        if (\n            result.get("state") not in {"PASS", "WARN"}\n            or result.get("provider_requests") != 0\n            or result.get("remote_request_sent") is not False\n            or result.get("model_calls") != 0\n            or result.get("paid_execution") is not False\n            or result.get("billing_changed") is not False\n        ):\n            return result, ["content_quality_offline_contract_violation"]\n        return result, []\n\n    def _load_chapter''',
                  'yandex guard helper')
              text = replace_once(text,
                  '''        profile_path, book, job, text = self._load_chapter(book_name, job_id)\n        configured_profile = (''',
                  '''        profile_path, book, job, text = self._load_chapter(book_name, job_id)\n        content_quality, quality_blockers = self._content_quality_status(profile_path.name)\n        configured_profile = (''',
                  'yandex analyze guard')
              text = replace_once(text,
                  '''        blockers = self._manifest_blockers(job_dir, job_id=job_id, text=text)''',
                  '''        blockers = [*quality_blockers, *self._manifest_blockers(job_dir, job_id=job_id, text=text)]''',
                  'yandex blockers')
              text = replace_once(text,
                  '''        if request_cap:\n            try:\n                credential_available = bool(self.backend.validate_config(resolve_credentials=True).get("credentials_present"))''',
                  '''        if request_cap and not quality_blockers:\n            try:\n                credential_available = bool(self.backend.validate_config(resolve_credentials=True).get("credentials_present"))''',
                  'yandex credential guard')
              text = replace_once(text,
                  '''        }\n        return {\n            "profile_path": profile_path,''',
                  '''        }\n        if content_quality is not None:\n            critical["content_quality_gate"] = {\n                "gate_version": content_quality.get("gate_version"),\n                "gate_fingerprint": content_quality.get("gate_fingerprint"),\n                "evidence_sha256": content_quality.get("evidence_sha256"),\n                "state": content_quality.get("state"),\n            }\n        return {\n            "profile_path": profile_path,''',
                  'yandex critical CQ')
              text = replace_once(text,
                  '''            "billing": billing,\n            "blockers": blockers,''',
                  '''            "billing": billing,\n            "content_quality": content_quality,\n            "blockers": blockers,''',
                  'yandex analysis result')
              text = replace_once(text,
                  '''            "credential_available": analysis["credential_available"],\n            "warnings": analysis["warnings"],''',
                  '''            "credential_available": analysis["credential_available"],\n            "content_quality": analysis["content_quality"],\n            "warnings": analysis["warnings"],''',
                  'yandex plan result')
              old_run = '''                output_path = self.backend.run_text_job(\n                    analysis["text"],\n                    analysis["job_dir"],\n                    job_id=str(plan["job_id"]),\n                    pricing=self.pricing,\n                    scope="book",\n                    cache_only=request_cap == 0,\n                )'''
              new_run = '''                def run_provider_job() -> Path:\n                    return self.backend.run_text_job(\n                        analysis["text"],\n                        analysis["job_dir"],\n                        job_id=str(plan["job_id"]),\n                        pricing=self.pricing,\n                        scope="book",\n                        cache_only=request_cap == 0,\n                    )\n\n                if self.content_quality_guard is None:\n                    output_path = run_provider_job()\n                else:\n                    with self.content_quality_guard(str(plan["book_file"])):\n                        output_path = run_provider_job()'''
              text = replace_once(text, old_run, new_run, 'yandex execution barrier')
              path.write_text(text, encoding='utf-8')

          # OpenAI paid service: same optional-in-core / required-in-app contract.
          path = Path('audiobook-studio/paid_run.py')
          text = path.read_text(encoding='utf-8')
          if 'self.content_quality_guard = content_quality_guard' not in text:
              text = replace_once(text,
                  '''        now: Callable[[], datetime] | None = None,\n    ) -> None:''',
                  '''        now: Callable[[], datetime] | None = None,\n        content_quality_guard: Callable[[str], Any] | None = None,\n    ) -> None:''',
                  'openai constructor signature')
              text = replace_once(text,
                  '''        self._now = now or (lambda: datetime.now(timezone.utc))\n        if ttl_seconds <= 0:''',
                  '''        self._now = now or (lambda: datetime.now(timezone.utc))\n        self.content_quality_guard = content_quality_guard\n        if ttl_seconds <= 0:''',
                  'openai guard assignment')
              text = replace_once(text,
                  '''    def _load_source(self, book_name: str, job_id: str) -> tuple[Path, dict[str, Any], dict[str, Any], str]:''',
                  '''    def _content_quality_status(self, book_name: str) -> tuple[dict[str, Any] | None, list[str]]:\n        if self.content_quality_guard is None:\n            return None, []\n        try:\n            with self.content_quality_guard(book_name) as evidence:\n                result = dict(evidence)\n        except Exception as error:\n            code = str(getattr(error, "code", "content_quality_blocked"))\n            return {\n                "schema_version": 1,\n                "state": "BLOCKED",\n                "blockers": [code],\n                "provider_requests": 0,\n                "remote_request_sent": False,\n                "model_calls": 0,\n                "paid_execution": False,\n                "billing_changed": False,\n            }, [code]\n        if (\n            result.get("state") not in {"PASS", "WARN"}\n            or result.get("provider_requests") != 0\n            or result.get("remote_request_sent") is not False\n            or result.get("model_calls") != 0\n            or result.get("paid_execution") is not False\n            or result.get("billing_changed") is not False\n        ):\n            return result, ["content_quality_offline_contract_violation"]\n        return result, []\n\n    def _load_source(self, book_name: str, job_id: str) -> tuple[Path, dict[str, Any], dict[str, Any], str]:''',
                  'openai guard helper')
              text = replace_once(text,
                  '''        source_path, book, job, text = self._load_source(book_name, job_id)\n        profile = load_approved_profile(profile_id)''',
                  '''        source_path, book, job, text = self._load_source(book_name, job_id)\n        content_quality, quality_blockers = self._content_quality_status(source_path.name)\n        profile = load_approved_profile(profile_id)''',
                  'openai analyze guard')
              text = replace_once(text,
                  '''        entries, blockers = self._manifest_entries(job_dir, job_id=job_id, profile_id=profile_id)\n        counts =''',
                  '''        entries, blockers = self._manifest_entries(job_dir, job_id=job_id, profile_id=profile_id)\n        blockers = [*quality_blockers, *blockers]\n        counts =''',
                  'openai blockers')
              text = replace_once(text,
                  '''        credential_available = self.backend.credential_available() if eligible else False\n        if eligible and not credential_available:''',
                  '''        credential_available = self.backend.credential_available() if eligible and not quality_blockers else False\n        if eligible and not quality_blockers and not credential_available:''',
                  'openai credential guard')
              text = replace_once(text,
                  '''        }\n        return {\n            "critical": critical,''',
                  '''        }\n        if content_quality is not None:\n            critical["content_quality_gate"] = {\n                "gate_version": content_quality.get("gate_version"),\n                "gate_fingerprint": content_quality.get("gate_fingerprint"),\n                "evidence_sha256": content_quality.get("evidence_sha256"),\n                "state": content_quality.get("state"),\n            }\n        return {\n            "critical": critical,''',
                  'openai critical CQ')
              text = replace_once(text,
                  '''            "billing": billing_snapshot,\n            "warnings": list(dict.fromkeys([''',
                  '''            "billing": billing_snapshot,\n            "content_quality": content_quality,\n            "warnings": list(dict.fromkeys([''',
                  'openai analysis result')
              text = replace_once(text,
                  '''            "credential_available": analysis["credential_available"],\n            "cost_estimate": None,''',
                  '''            "credential_available": analysis["credential_available"],\n            "content_quality": analysis["content_quality"],\n            "cost_estimate": None,''',
                  'openai plan result')
              old_run = '''            with production_authority_lock(\n                self.workspace_root,\n                provider="openai",\n                book_slug=str(plan["book_id"]),\n                job_id=str(plan["job_id"]),\n                profile_id=str(plan["profile_id"]),\n                exclusive=True,\n            ):\n                manifest_path, result = temporary_backend.run_approved_segment(\n                    analysis["text"],\n                    analysis["job_dir"],\n                    job_id=str(plan["job_id"]),\n                    profile_id=str(plan["profile_id"]),\n                    pricing=self.pricing,\n                    selected_segment_id=plan.get("selected_segment_id"),\n                )'''
              new_run = '''            with production_authority_lock(\n                self.workspace_root,\n                provider="openai",\n                book_slug=str(plan["book_id"]),\n                job_id=str(plan["job_id"]),\n                profile_id=str(plan["profile_id"]),\n                exclusive=True,\n            ):\n                def run_provider_segment():\n                    return temporary_backend.run_approved_segment(\n                        analysis["text"],\n                        analysis["job_dir"],\n                        job_id=str(plan["job_id"]),\n                        profile_id=str(plan["profile_id"]),\n                        pricing=self.pricing,\n                        selected_segment_id=plan.get("selected_segment_id"),\n                    )\n\n                if self.content_quality_guard is None:\n                    manifest_path, result = run_provider_segment()\n                else:\n                    with self.content_quality_guard(str(plan["book_file"])):\n                        manifest_path, result = run_provider_segment()'''
              text = replace_once(text, old_run, new_run, 'openai execution barrier')
              path.write_text(text, encoding='utf-8')

          # Actual application wiring: every production service gets the guard;
          # direct Qwen and legacy direct OpenAI execution are also fenced.
          path = Path('audiobook-studio/audiobook_studio_app_runner.py')
          text = path.read_text(encoding='utf-8')
          if 'from content_quality_execution import hold_current_content_quality' not in text:
              text = replace_once(text,
                  '''from book_text_preparation import BookTextPreparationService\nfrom chapter_production import YandexChapterProductionService''',
                  '''from book_text_preparation import BookTextPreparationService\nfrom content_quality_execution import hold_current_content_quality\nfrom chapter_production import YandexChapterProductionService''',
                  'app guard import')
              text = replace_once(text,
                  '''def _billing_service() -> CloudBillingService:\n    return CloudBillingService(''',
                  '''def _content_quality_execution(book_name: str):\n    return hold_current_content_quality(\n        library=BOOK_LIBRARY,\n        workspace_root=WORKSPACE_PATHS.root,\n        book_name=book_name,\n    )\n\n\ndef _billing_service() -> CloudBillingService:\n    return CloudBillingService(''',
                  'app guard helper')
              # Two plan service constructors have the same final plans_dir anchor.
              paid_anchor = '''        books_dir=WORKSPACE_PATHS.books_root,\n        plans_dir=WORKSPACE_PATHS.paid_run_plans,\n    )'''
              count = text.count(paid_anchor)
              if count != 2:
                  raise SystemExit(f'app service constructors: expected 2 anchors, found {count}')
              text = text.replace(paid_anchor,
                  '''        books_dir=WORKSPACE_PATHS.books_root,\n        plans_dir=WORKSPACE_PATHS.paid_run_plans,\n        content_quality_guard=_content_quality_execution,\n    )''')
              old_qwen = '''    if args.run_qwen:\n        return _delegate(\n            QWEN_RUNNER,\n            "--run",\n            "--book", _require(args.book, "--book"),\n            "--job", _require(args.job, "--job"),\n            "--speaker", _require(args.speaker, "--speaker"),\n        )'''
              new_qwen = '''    if args.run_qwen:\n        book_name = _require(args.book, "--book")\n        with _content_quality_execution(book_name):\n            return _delegate(\n                QWEN_RUNNER,\n                "--run",\n                "--book", book_name,\n                "--job", _require(args.job, "--job"),\n                "--speaker", _require(args.speaker, "--speaker"),\n            )'''
              text = replace_once(text, old_qwen, new_qwen, 'qwen execution barrier')
              old_openai = '''    if args.run_openai:\n        return _delegate(\n            OPENAI_RUNNER,\n            "--run",\n            "--book", _require(args.book, "--book"),\n            "--job", _require(args.job, "--job"),\n            "--profile-id", _require(args.profile_id, "--profile-id"),\n        )'''
              new_openai = '''    if args.run_openai:\n        book_name = _require(args.book, "--book")\n        with _content_quality_execution(book_name):\n            return _delegate(\n                OPENAI_RUNNER,\n                "--run",\n                "--book", book_name,\n                "--job", _require(args.job, "--job"),\n                "--profile-id", _require(args.profile_id, "--profile-id"),\n            )'''
              text = replace_once(text, old_openai, new_openai, 'legacy openai execution barrier')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify only intended source files changed
        run: |
          files="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' audiobook-studio/audiobook_studio_app_runner.py audiobook-studio/chapter_production.py audiobook-studio/paid_run.py | sort)"
          test "$files" = "$expected"
          grep -q 'content_quality_guard=_content_quality_execution' audiobook-studio/audiobook_studio_app_runner.py
          grep -q 'with self.content_quality_guard(str(plan\["book_file"\]))' audiobook-studio/chapter_production.py
          grep -q 'with self.content_quality_guard(str(plan\["book_file"\]))' audiobook-studio/paid_run.py
      - name: Commit deterministic wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiobook-studio/audiobook_studio_app_runner.py audiobook-studio/chapter_production.py audiobook-studio/paid_run.py
          git commit -m "Wire Content Quality into provider execution paths"
          git push origin HEAD:brain/content-quality-lexicon-v1
