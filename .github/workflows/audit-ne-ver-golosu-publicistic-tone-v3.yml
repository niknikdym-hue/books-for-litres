name: Audit Ne ver golosu publicistic tone v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ne-ver-golosu-publicistic-tone-v3.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan remaining stiff language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          root=Path('ne-ver-golosu/manuscript')
          files=sorted(p for p in root.glob('*.md') if p.name!='17-SOURCES.md')
          terms=[
            r'высокорисков',r'риск-процед',r'контрольн(?:ая|ый|ое|ые|ого|ому)',r'источник контроля',
            r'финальн(?:ый|ая|ое) контрол',r'класс риска',r'контекст операции',r'регламент',
            r'процедур',r'протокол',r'канал коммуникац',r'независимый канал',r'смена канала',
            r'защитн(?:ая задача|ый вывод|ое решение|ый принцип|ая логика)',r'слой контроля',
            r'архитектурный вопрос',r'операционн(?:ый|ая) модель',r'механизм подтверждения',
            r'система должна',r'включается процедура',r'уровень проверки',r'уровень риска'
          ]
          rx=[re.compile(x,re.I) for x in terms]
          score=collections.Counter(); hits=[]
          for p in files:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              found=[r.pattern for r in rx if r.search(line)]
              if found:
                score[p.name]+=len(found)
                hits.append((len(found),p.name,n,found,line))
          print('TOP_FILES')
          for k,v in score.most_common(): print(v,k)
          print('LINES')
          for c,name,n,found,line in sorted(hits,reverse=True)[:240]:
            print(f'{c}\t{name}:{n}\t{found}\t{line}')
          PY
