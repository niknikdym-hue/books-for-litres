name: Polish Ne ver golosu style lightness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-ne-ver-golosu-style-lightness.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lighten remaining meta and technical-sounding prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')
          changes={
          '00-PROLOG.md': [
            ('Книга, после которой человек начинает подозревать дипфейк в поздравлении двоюродной сестры, сделала плохую работу.',
             'Если после разговора о дипфейках человек начинает подозревать подделку в поздравлении двоюродной сестры, пользы от такого разговора мало.'),
            ('Вот вокруг этого вопроса и построена книга.', 'Именно этот вопрос — главный.')],
          '01-VOICE.md': [
            ('Корпоративная безопасность, которая держится на способности бухгалтерии распознавать начальника на слух, имеет архитектурную проблему независимо от качества дипфейков.',
             'Если корпоративная безопасность держится на способности бухгалтерии распознавать начальника на слух, уязвимость заложена в самой системе — независимо от качества дипфейков.'),
            ('Это принципиально для всей книги.', 'Это принципиально.')],
          '02-FACE.md': [
            ('Потому что книга о новой реальности очень легко сама становится производителем мифов о новой реальности.',
             'Потому что разговор о новой реальности легко сам становится источником новых мифов.'),
            ('### Что защитного даёт гонконгский кейс', '### Что показывает гонконгский случай')],
          '03-MESSAGES.md': [
            ('На самом деле она просто требует другой модели.', 'На самом деле нужно просто иначе смотреть на ситуацию.'),
            ('В старой модели вы оцениваете канал:', 'При старом подходе вы оцениваете канал:'),
            ('В новой модели вы оцениваете **аномалию действия**:', 'При новом подходе вы оцениваете **аномалию действия**:'),
            ('Модель не требует решить, взломан ли аккаунт. Это прекрасная экономия.',
             'Такой подход не требует решать, взломан ли аккаунт. Это прекрасная экономия.')],
          '04-EVIDENCE.md': [
            ('Новые инструменты меняют скорость и качество изготовления, но не фундаментальную логику проверки.',
             'Новые инструменты меняют скорость и качество изготовления, но не сам принцип проверки.'),
            ('Эта логика скучнее визуального детектива. Зато она не зависит от качества фотомонтажа.',
             'Такой подход скучнее визуального детектива. Зато он не зависит от качества фотомонтажа.'),
            ('Стандарты происхождения цифрового контента, к которым мы ещё придём, помогают проверить историю файла и заявленные действия с ним.',
             'Стандарты происхождения цифрового контента помогают проверить историю файла и заявленные действия с ним.'),
            ('Это будет повторяться по всей книге: хорошая процедура часто **убирает необходимость распознавать способ подделки**.',
             'И здесь снова работает простой принцип: хорошая процедура часто **убирает необходимость распознавать способ подделки**.')],
          '07A-TRUST-CHAIN.md': [
            ('Главное достоинство этой модели:', 'Главное достоинство такого подхода:'),
            ('Это не повод устраивать расследование дома. Это обычная логика локализации инцидента.',
             'Это не повод устраивать расследование дома. Это обычный способ ограничить последствия.'),
            ('Именно с этого начинается следующая часть книги.', 'С этого и начинается новая архитектура доверия.')],
          '09-RISK.md': [
            ('Риск-модель защищает не только от подделки.', 'Оценка риска защищает не только от подделки.')],
          '11-BUSINESS.md': [
            ('Но кейс позволяет задать архитектурный вопрос:', 'Но этот случай позволяет задать вопрос к самой системе:')],
          '11A-WHO-IS-REAL.md': [
            ('Это очень глубокий принцип для всей книги:', 'Отсюда важный принцип:'),
            ('То есть делает ровно то, к чему мы постепенно пришли в семье и бизнесе: **заменяет ощущение подлинности архитектурой подлинности**.',
             'То есть делает ровно то, что нужно семье и бизнесу: **заменяет ощущение подлинности проверяемым подтверждением**.'),
            ('Эта архитектура всё равно не идеальна.', 'Такая система всё равно не идеальна.')],
          '12-DETECTORS-PROVENANCE.md': [
            ('Это важная модель будущего доверия: **доказательство не обязано быть похоже на человека**.',
             'Это важный принцип будущего доверия: **доказательство не обязано быть похоже на человека**.'),
            ('Практически полезная модель выглядит так.', 'Практически это выглядит так.')],
          '13-DIGITAL-DOUBLE.md': [
            ('Это напоминает архитектуру из предыдущих глав: важнее не победить фейк эстетически, а восстановить независимую точку доверия.',
             'Здесь работает тот же принцип: важнее не победить фейк эстетически, а восстановить независимую точку доверия.'),
            ('В книге нет необходимости описывать способы создания такого контента. Достаточно увидеть принципиальную перемену:',
             'Способы создания такого контента не важны для защиты. Достаточно увидеть принципиальную перемену:')],
          '13A-PUBLIC-EVIDENCE.md': [
            ('Мы уже применяли риск-модель к действиям. Её можно адаптировать и к убеждениям.',
             'Тот же принцип оценки риска можно применить и к убеждениям.')],
          '14-LIARS-DIVIDEND.md': [
            ('Это ровно обратное тому, что мы строили всю книгу.', 'Это ровно обратное тому, как должна работать проверка.'),
            ('### Парадокс названия книги', '### Что на самом деле значит «не верь голосу»'),
            ('К этому моменту должно быть ясно, что книга утверждает почти противоположное.',
             'На самом деле смысл почти противоположный.')],
          '15-CONCLUSION.md': [
            ('За всю книгу нам не понадобилось научиться определять процент синтетичности видео.',
             'Для защиты не понадобилось учиться определять процент синтетичности видео.'),
            ('После такой книги легко начать прислушиваться к каждому голосовому сообщению и искать металлическую ноту.',
             'Легко начать прислушиваться к каждому голосовому сообщению и искать металлическую ноту.'),
            ('Поэтому книга намеренно не строилась вокруг списка сервисов и артефактов.',
             'Поэтому нет смысла строить защиту вокруг списка сервисов и внешних признаков подделки.')],
          '16-APPENDICES.md': [
            ('Для регулируемых отраслей и крупных организаций его нужно адаптировать к внутренним требованиям, закону и модели угроз.',
             'Для регулируемых отраслей и крупных организаций его нужно адаптировать к внутренним требованиям, закону и реальным угрозам.'),
            ('**C2PA** — открытая техническая спецификация для проверяемых данных о происхождении цифрового контента; в книге используется версия 2.4.',
             '**C2PA** — открытая техническая спецификация для проверяемых данных о происхождении цифрового контента; версия 2.4 актуальна на август 2026 года.')],
          }
          changed=[]
          for name,pairs in changes.items():
              p=root/name
              t=p.read_text(encoding='utf-8')
              before=t
              for old,new in pairs:
                  if old not in t:
                      raise SystemExit(f'Missing exact phrase in {name}: {old[:130]}')
                  t=t.replace(old,new)
              if t!=before:
                  p.write_text(t,encoding='utf-8')
                  changed.append(name)
          print('CHANGED',len(changed),changed)
          PY
          git diff --check
      - name: Commit polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Lighten style in Ne ver golosu'
          git push
