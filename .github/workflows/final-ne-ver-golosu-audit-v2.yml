name: Final Ne ver golosu absolute audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ne-ver-golosu-audit-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Absolute final manuscript audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          root=Path('ne-ver-golosu/manuscript')
          reader=sorted(p for p in root.glob('*.md') if p.name!='17-SOURCES.md')
          text='\n'.join(p.read_text(encoding='utf-8') for p in reader)
          sources=(root/'17-SOURCES.md').read_text(encoding='utf-8')

          # 1. No English professional jargon in reader text.
          banned_en=[
            'authenticity','detection','deepfake detection','identity proofing','remote proofing',
            'liveness','provenance','human-in-the-loop','authorization','authentication intent',
            'forensic','false positive','false negative',"liar's dividend",'generative ai',
            'deepfake video','deepfake audio','knowledge-based','security concept'
          ]
          low=text.lower()
          bad_en=[x for x in banned_en if x in low]
          print('BANNED_ENGLISH',bad_en)

          # 2. Every Latin token must belong to the deliberately retained official/technical set.
          rx=re.compile(r"[A-Za-z][A-Za-z0-9’'._+-]*")
          tokens=collections.Counter()
          contexts=collections.defaultdict(list)
          for p in reader:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              clean=re.sub(r'https?://\S+','',line)
              for tok in rx.findall(clean):
                tokens[tok]+=1
                if len(contexts[tok])<2: contexts[tok].append(f'{p.name}:{n}:{line.strip()}')
          allowed={'NIST','SP','A-4','B-4','C2PA','Content','Credentials','Credentials.','PDF','PDF-','WhatsApp-','IC3','I.','II.','III.','IV.'}
          unexpected=sorted(t for t in tokens if t not in allowed)
          print('LATIN_TOKENS',dict(tokens))
          print('UNEXPECTED_LATIN',unexpected)
          for t in unexpected:
            for c in contexts[t]: print(' ',c)

          # Content Credentials exactly twice in reader text: first official explanation + glossary.
          cc=text.count('Content Credentials')
          print('CONTENT_CREDENTIALS_COUNT',cc)

          # 3. No known mechanical-replacement damage.
          mechanical=[
            'без проверяемые','с безупречными проверяемые','отсутствие проверяемые',
            'У файла нет проверяемые','проверяемые данные о происхождении дают **сигналы',
            '№152-ФЗ'
          ]
          bad_mech=[x for x in mechanical if x in text]
          print('MECHANICAL',bad_mech)

          # 4. No stale attacker-side model or previously removed ready-made scripts.
          offensive=[
            'вход → подтверждение легенды → перенос → изоляция → действие',
            'Я сейчас без связи. Срочно выгрузи базу клиентов',
            'Вот письмо директора — переведите',
            'Подросток получает голосовое от «мамы»: срочно пришли код',
            'Позвоните моему новому помощнику',
            'скинь мастеру ещё 30 тысяч',
            'срочно пришли код подтверждения',
            'Мошенничество часто выигрывает, потому что эти три вопроса сливаются'
          ]
          bad_off=[x for x in offensive if x in text or x in sources]
          print('OFFENSIVE_STALE',bad_off)

          # 5. Legal/source precision gates.
          stale_legal=[
            'Статья 9, устанавливающая требования к маркировке',
            'Статья 9 о маркировке информационных материалов',
            '**Robert Chesney, Danielle Keats Citron.**',
            'статьи 8–10, включая требования к маркировке'
          ]
          bad_legal=[x for x in stale_legal if x in text or x in sources]
          print('STALE_LEGAL_SOURCE',bad_legal)
          required=[
            'Статья 9, посвящённая информационному предупреждению',
            'не устанавливает универсальную обязанность маркировать каждый материал',
            'https://publication.pravo.gov.ru/document/0001202605020015',
            'https://www.consultant.ru/document/cons_doc_LAW_61801/7336c78762a98b5f4f698b8c3800dca1111acc16/',
            '**Bobby Chesney, Danielle Citron.**',
            'https://doi.org/10.1017/S0003055423001454',
            'https://www.ic3.gov/PSA/2022/PSA220216'
          ]
          combined=text+'\n'+sources
          missing=[x for x in required if x not in combined]
          print('MISSING_REQUIRED_PRECISION',missing)

          # 6. Surface potentially attack-oriented sentences for manual review, but fail only on concrete operational verbs.
          suspicious=[]
          pats=[
            r'(?i)(?:мошенник|злоумышленник|атакующий)[^.!?]{0,120}(?:нужно|достаточно|может получить|должен|следует|выгодно|обойти|скрыть|маскировать)',
            r'(?i)(?:как|способ)[^.!?]{0,100}(?:взломать|захватить|скомпрометировать|клонировать|подделать|обойти защит)'
          ]
          for p in reader:
            for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(re.search(pat,line) for pat in pats): suspicious.append(f'{p.name}:{n}:{line.strip()}')
          print('SUSPICIOUS_OPERATIONAL_CANDIDATES',len(suspicious))
          for s in suspicious: print(s)

          failures=[]
          if bad_en: failures.append('English jargon')
          if unexpected: failures.append('Unexpected Latin')
          if cc!=2: failures.append('Content Credentials count')
          if bad_mech: failures.append('Mechanical damage')
          if bad_off: failures.append('Stale offensive wording')
          if bad_legal: failures.append('Stale legal wording')
          if missing: failures.append('Missing source/legal precision')
          print('FINAL_FAILURES',failures)
          if failures: raise SystemExit(1)
          PY
