name: Final style clean Ne ver golosu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-style-clean-ne-ver-golosu.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean remaining jargon in manuscript and sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ne-ver-golosu/manuscript')
          changes={
          '10-FAMILY.md': [
            ('Во многих семьях есть «операционная система» — человек, который знает номера врачей, банковские контакты, страховки, документы, планы поездок и телефоны родственников.',
             'Во многих семьях есть человек, на котором держится бытовая организация: он знает номера врачей, банковские контакты, страховки, документы, планы поездок и телефоны родственников.')],
          '11-BUSINESS.md': [
            ('### Кейс, в котором видео оказалось административным паролем',
             '### Когда видео заменило подтверждение полномочий')],
          '12-DETECTORS-PROVENANCE.md': [
            ('Через несколько лет сегодняшние советы по артефактам будут выглядеть так же забавно, как инструкции отличать поддельный сайт по тому, что у него «некачественный дизайн».',
             'Через несколько лет сегодняшние советы по внешним признакам подделки будут выглядеть так же забавно, как инструкции отличать поддельный сайт по тому, что у него «некачественный дизайн».')],
          '13A-PUBLIC-EVIDENCE.md': [
            ('Эти четыре вопроса устойчивее игры «найди артефакт на лице».',
             'Эти четыре вопроса устойчивее игры «найди странность на лице».')],
          '14-LIARS-DIVIDEND.md': [
            ('В предыдущей главе мы обсуждали проверяемые данные о происхождении применительно к файлу. Но значение проверяемого происхождения шире.',
             'Проверяемое происхождение важно не только для отдельного файла.')],
          '16-APPENDICES.md': [
            ('Для реальных кейсов ищите полицию, суд, регулятора или официальное заявление стороны прежде, чем повторять эффектный пересказ.',
             'Для реальных случаев ищите полицию, суд, регулятора или официальное заявление стороны прежде, чем повторять эффектный пересказ.')],
          '17-SOURCES.md': [
            ('Фактологический срез этой книги сделан на **14 августа 2026 года**. Технологии синтетического контента, стандарты и законодательство меняются; для быстро меняющихся утверждений в тексте сознательно избегаются универсальные численные обещания и рейтинги конкретных сервисов.',
             'Сведения и правовые положения проверены по состоянию на **14 августа 2026 года**. Технологии синтетического контента, стандарты и законодательство меняются, поэтому быстро устаревающие численные обещания и рейтинги конкретных сервисов не используются.'),
            ('Ниже перечислены основные источники, на которых основаны проверяемые факты, реальные кейсы и технические/правовые границы книги.',
             'Ниже — основные источники для проверяемых фактов, реальных случаев, технических и правовых положений.'),
            ('Использованы для общей рамки возможностей и законных/вредоносных применений; конкретные быстро устаревающие показатели не переносились в текст как универсальные свойства отрасли.',
             'Использованы для описания возможностей, законных и вредоносных применений; конкретные быстро устаревающие показатели не представлены как универсальные свойства отрасли.'),
            ('Это первичный источник для двух корпоративных кейсов 2024 года. В книге сохранено важное уточнение официального сообщения: январская видеоконференция описана полицией как **предварительно записанная**, без реального взаимодействия с изображёнными участниками. Медийная версия о полностью интерактивной «живой комнате дипфейков» не используется как установленный факт.',
             'Это первичный источник для двух корпоративных случаев 2024 года. Важно уточнение официального сообщения: январская видеоконференция описана полицией как **предварительно записанная**, без реального взаимодействия с изображёнными участниками. Медийная версия о полностью интерактивной «живой комнате дипфейков» не используется как установленный факт.'),
            ('**Правительство Гонконга, ФБР и Интерпол** — те же первичные материалы, перечисленные выше и ниже. Они используются только для защитного вывода: несколько каналов связи не равны нескольким независимым источникам. Интерлюдия выделяет авторские контрольные точки защиты — необычный контакт, внешнюю убедительность, смену канала, давление срочностью или секретностью и необратимое действие. Это не официальная классификация правоохранительных органов и не описание порядка совершения атаки.',
             '**Правительство Гонконга, ФБР и Интерпол** — те же первичные материалы, перечисленные выше и ниже. Они подтверждают простой принцип: несколько каналов связи не равны нескольким независимым источникам. В интерлюдии выделены точки, в которых стоит остановиться и проверить ситуацию: необычный контакт, внешняя убедительность, смена канала, давление срочностью или секретностью и необратимое действие. Это не официальная классификация правоохранительных органов и не описание порядка совершения атаки.'),
            ('Спецификация использована для понятий происхождения, утверждений, подписи утверждения, манифеста и Content Credentials. В книге отдельно подчёркнуто: криптографически проверяемая история происхождения не равна доказательству истинности всех слов или событий внутри материала.',
             'Спецификация использована для понятий происхождения, утверждений, подписи утверждения, манифеста и Content Credentials. Важно: криптографически проверяемая история происхождения не равна доказательству истинности всех слов или событий внутри материала.'),
            ('**NIST SP 800-63-4.** Общий риск-ориентированный принцип выбора требуемого уровня уверенности использован как интеллектуальная опора главы 9. Бытовая трёхзонная модель книги является авторской и не выдаётся за официальный стандарт NIST.',
             '**NIST SP 800-63-4.** Риск-ориентированный принцип выбора требуемого уровня уверенности использован в главе 9 для выбора глубины проверки по цене ошибки. Трёхзонное деление — практическое упрощение, а не официальный стандарт NIST.'),
            ('Книга **не** выдаёт NIST за бытовой стандарт для российских семей или компаний. Понятие авторизации используется в его общем смысле информационной безопасности и отдельно от уровней уверенности аутентификации NIST.',
             'Принципы NIST используются как ориентир, а не как бытовой стандарт для российских семей или компаний. Понятие авторизации используется в его общем смысле информационной безопасности и отдельно от уровней уверенности аутентификации NIST.'),
            ('**NIST AI 100-4** и **C2PA 2.4** используются для различения выявления подделки, происхождения и подлинности. Ключевой вывод книги: технически подтверждаемое происхождение актива и истинность утверждения внутри актива — разные вопросы.',
             '**NIST AI 100-4** и **C2PA 2.4** используются для различения выявления подделки, происхождения и подлинности. Ключевой вывод: технически подтверждаемое происхождение актива и истинность утверждения внутри актива — разные вопросы.'),
            ('Отсутствие Content Credentials не трактуется в книге как доказательство подделки; наличие валидных Content Credentials не трактуется как доказательство истинности каждого утверждения в материале.',
             'Отсутствие Content Credentials не является доказательством подделки; наличие валидных Content Credentials не является доказательством истинности каждого утверждения в материале.'),
            ('Правовые положения актуализированы на дату фактологического среза. Книга не является индивидуальной юридической консультацией и не обещает одинаковой квалификации для всех случаев с дипфейками.',
             'Правовые положения проверены по состоянию на 14 августа 2026 года. Этот раздел не является индивидуальной юридической консультацией: правовая квалификация зависит от обстоятельств конкретного случая.'),
            ('**Федеральный закон от 26.07.2026 № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации».** На дату фактологического среза 14 августа 2026 года закон подписан и опубликован, но ещё не вступил в силу.',
             '**Федеральный закон от 26.07.2026 № 243-ФЗ «О поддержке развития технологий искусственного интеллекта в Российской Федерации».** По состоянию на 14 августа 2026 года закон подписан и опубликован, но ещё не вступил в силу.'),
            ('Поэтому книга не называет любую фотографию или любую запись голоса биометрическими персональными данными автоматически.',
             'Поэтому сама по себе фотография или запись голоса не означает автоматически, что перед нами биометрические персональные данные.'),
            ('В книге сохранено важное ограничение результата: эффект ложных заявлений о дезинформации был устойчивее для текстовых историй; утверждения о дипфейке против видеодоказательств в большинстве тестов не давали такого же устойчивого эффекта.',
             'Важное ограничение результата: эффект ложных заявлений о дезинформации был устойчивее для текстовых историй; утверждения о дипфейке против видеодоказательств в большинстве тестов не давали такого же устойчивого эффекта.'),
            ('В книге намеренно не используется общая статистика мошенничества как «статистика дипфейков».',
             'Общая статистика мошенничества не используется как «статистика дипфейков».'),
            ('Читателю, которому нужны рекомендации после даты фактологического среза, следует проверять раздел Банка России «Противодействие мошенническим практикам», актуальные материалы NIST, Федеральной торговой комиссии США, ФБР/IC3, Интерпола/Европола, C2PA и действующие редакции российского законодательства.',
             'Для актуальных рекомендаций после 14 августа 2026 года следует проверять раздел Банка России «Противодействие мошенническим практикам», актуальные материалы NIST, Федеральной торговой комиссии США, ФБР/IC3, Интерпола/Европола, C2PA и действующие редакции российского законодательства.')],
          }
          changed=[]
          for name,pairs in changes.items():
              p=root/name
              t=p.read_text(encoding='utf-8')
              before=t
              for old,new in pairs:
                  if old not in t:
                      raise SystemExit(f'Missing exact phrase in {name}: {old[:140]}')
                  t=t.replace(old,new)
              if t!=before:
                  p.write_text(t,encoding='utf-8')
                  changed.append(name)
          print('CHANGED',len(changed),changed)
          PY
          git diff --check
      - name: Commit final style cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ne-ver-golosu/manuscript
          git commit -m 'Finish style cleanup in Ne ver golosu'
          git push
